couples: {}

initial_values:
  # Singles male
  beta_l0_sm: 0.30
  beta_c_sm: 0.80
  theta_l_sm: -0.20
  theta_c_sm: 0.20

  # Singles female
  beta_l0_sf: 0.30
  beta_c_sf: 0.80
  theta_l_sf: -0.20
  theta_c_sf: 0.20

  # Couples male leisure
  beta_l0_m: 0.30
  theta_l_m: -0.20

  # Couples female leisure
  beta_l0_f: 0.30
  theta_l_f: -0.20

  # Couples household consumption
  beta_c: 0.80
  theta_c: 0.20

  # Opportunity baseline
  beta_offer_working: 0.50
  beta_offer_gsur: -0.10
  beta_offer_gsur_isco1_1: 0.00
  beta_offer_gsur_isco1_2: 0.00
  beta_offer_gsur_isco1_3: 0.00
  beta_offer_gsur_isco1_4: 0.00
  beta_offer_gsur_isco1_5: 0.00
  beta_offer_gsur_isco1_6: 0.00
  beta_offer_gsur_isco1_7: 0.00
  beta_offer_gsur_isco1_8: 0.00
  beta_offer_gsur_isco1_9: 0.00

optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 6000
  tolerance: 1.0e-8
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    # Box-Cox exponents
    theta_l_sm: [-8.0, 0.95]
    theta_c_sm: [-8.0, 0.95]
    theta_l_sf: [-8.0, 0.95]
    theta_c_sf: [-8.0, 0.95]
    theta_l_m: [-8.0, 0.95]
    theta_l_f: [-8.0, 0.95]
    theta_c: [-8.0, 0.95]

    # Preference scales
    beta_c_sm: [0.05, 50.0]
    beta_c_sf: [0.05, 50.0]
    beta_c: [0.05, 50.0]
    beta_l0_sm: [0.05, 50.0]
    beta_l0_sf: [0.05, 50.0]
    beta_l0_m: [0.05, 50.0]
    beta_l0_f: [0.05, 50.0]

    # Opportunity
    beta_offer_working: [-20.0, 20.0]
    beta_offer_gsur: [-40.0, 40.0]
    beta_offer_gsur_isco1_1: [-25.0, 25.0]
    beta_offer_gsur_isco1_2: [-25.0, 25.0]
    beta_offer_gsur_isco1_3: [-25.0, 25.0]
    beta_offer_gsur_isco1_4: [-25.0, 25.0]
