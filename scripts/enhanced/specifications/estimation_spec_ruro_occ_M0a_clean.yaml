# ==============================================================================
# RURO MNL Estimation Specification - RURO occupation-opportunity M0a (clean)
# ==============================================================================
# M0a-clean replaces the equality-constraint pool used in `ruro_occ_M0a` with a
# true renamed shared parameter `theta_c_singles`. The likelihood landscape is
# the same as the equality version, but the parameter vector is shorter by one
# entry (47 instead of 48) and the unconstrained Hessian is no longer
# rank-deficient by construction, so the post-estimation correlation panel
# stops reporting |corr| > 1 in the (beta_c_*, theta_c_*) block.
#
# Changes vs `estimation_spec_ruro_occ_M0a.yaml`:
#   1. specification.name -> "ruro_occ_M0a_clean"
#   2. utility.consumption.singles_box_cox_exponent: "theta_c_singles" (NEW)
#      The parser routes both singles_male and singles_female to this single
#      shared parameter; couples continue to use the ordinary `theta_c`.
#   3. `theta_c_singles_pool` expression_constraint REMOVED.
#   4. `theta_c_sm` and `theta_c_sf` removed from `initial_values` and `bounds`.
#   5. `theta_c_singles: -1.0` added to `initial_values`; `[-8.0, 0.95]` to bounds.
#
# Everything else is byte-identical to ruro_occ_M0a (which is itself M0
# minus the four beta_l_educH_* leisure-utility education shifters). No
# changes to hours / wage / market / occupation opportunity blocks, prior /
# proposal correction, MNL data, draws, or EUROMOD.
#
# Expected parameter count: 47.
#
# Reference docs:
#   Results/RURO_occ_M0a_simplification_plan_v1.md  (section 8e)
#   docs/archive/2026-05-26_round2_chain_compression/replaced_by_clean_corrected/RURO_occ_M0a_implementation_report_v1.md  (the equality version)
#   docs/RURO_occ_M0a_clean_implementation_report_v1.md  (this version)
# ==============================================================================

specification:
  name: "ruro_occ_M0a_clean"
  description: "M0a-clean: singles consumption Box-Cox curvature pooled into a single theta_c_singles parameter (replaces M0a's equality-constraint fallback). beta_l_educH still removed; couples unchanged."
  wage_spec: "vw"
  model_family: "regular"

utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"                  # couples shared
    singles_box_cox_exponent: "theta_c_singles"  # NEW (M0a-clean): singles shared
    box_cox_bounds: [-8.0, 0.95]

  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"
    box_cox_bounds: [-8.0, 0.95]
    shifters:
      - variable: "age_norm"
        coefficient: "beta_l_age"
      - variable: "age_norm2"
        coefficient: "beta_l_age2"
      - variable: "n_children"
        coefficient: "beta_l_nkids"
        gender_specific: true   # female only
      # REMOVED at M0a: educH shifter (corr(beta_l0_g, beta_l_educH_g) >= 0.97
      # across all four groups in M0). Education remains in the model via
      # beta_E_educH (market opportunity) and beta_w_educH (wage opportunity).

hours_opportunity:
  # IDENTICAL to M0 and M0a.
  shifters:
    - variable: "working"
      coefficient: "beta_E"
    - variable: "working_pt1"
      coefficient: "beta_h_pt1"
    - variable: "working_pt2"
      coefficient: "beta_h_pt2"
    - variable: "working_ft"
      coefficient: "beta_h_ft"

wage_opportunity:
  # IDENTICAL to M0 and M0a.
  specification: "log_normal"
  mean_shifters:
    - variable: "intercept"
      coefficient: "beta_w0"
    - variable: "educL"
      coefficient: "beta_w_educL"
    - variable: "educH"
      coefficient: "beta_w_educH"
    - variable: "pexp_years"
      coefficient: "beta_w_pexp"
    - variable: "pexp_years2"
      coefficient: "beta_w_pexp2"
  variance:
    parameter: "sigma"

market_opportunity:
  # IDENTICAL to M0 and M0a.
  applies_to: "both"
  employment_indicator: "working"
  gsur_variable: "gsur"
  offer_only_vars: ["gsur"]
  center_within_choice_set: true
  center_weights: "proposal"
  variable_scales:
    gsur: 10.0

  shifters:
    - variable: "gsur"
      coefficient: "beta_E_gsur"
      interaction: ["working"]
    - variable: "educH"
      coefficient: "beta_E_educH"
      interaction: ["working"]

occupation_opportunity:
  # IDENTICAL to M0 and M0a.
  variable: "loc4"
  reference: 1
  shifters:
    - variable: "loc4_2"
      coefficient: "beta_occ_2_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_cf"
      applies_to: "cf"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_cf"
      applies_to: "cf"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_cf"
      applies_to: "cf"
      interaction: ["working"]

couples: {}

initial_values:
  # Preferences - neutral starts (no warm-start from M0 or M0a).
  beta_l0_sm: 1.0
  beta_l_age_sm: 0.0
  beta_l_age2_sm: 0.0
  beta_c_sm: 1.0
  theta_l_sm: -1.0
  # REMOVED at M0a-clean: theta_c_sm (replaced by theta_c_singles).

  beta_l0_sf: 1.0
  beta_l_age_sf: 0.0
  beta_l_age2_sf: 0.0
  beta_l_nkids_sf: 0.0
  beta_c_sf: 1.0
  theta_l_sf: -1.0
  # REMOVED at M0a-clean: theta_c_sf (replaced by theta_c_singles).

  # NEW at M0a-clean: singles-shared consumption Box-Cox curvature.
  theta_c_singles: -1.0

  beta_l0_m: 1.0
  beta_l_age_m: 0.0
  beta_l_age2_m: 0.0
  theta_l_m: -1.0

  beta_l0_f: 1.0
  beta_l_age_f: 0.0
  beta_l_age2_f: 0.0
  beta_l_nkids_f: 0.0
  theta_l_f: -1.0

  beta_c: 1.0
  theta_c: -1.0    # couples shared curvature (UNCHANGED)

  # Employment intercept and hours focal-point shifters (identical to M0).
  beta_E:     0.0
  beta_h_pt1: 0.0
  beta_h_pt2: 0.0
  beta_h_ft:  0.0

  # Market opportunity residual (identical to M0).
  beta_E_gsur:  0.0
  beta_E_educH: 0.0

  # Wage opportunity Mincer mean (identical to M0).
  beta_w0:       2.0
  beta_w_educL: -0.1
  beta_w_educH:  0.2
  beta_w_pexp:   0.02
  beta_w_pexp2: -0.0003

  # Occupation opportunity (identical to M0).
  beta_occ_2_sm: 0.0
  beta_occ_3_sm: 0.0
  beta_occ_4_sm: 0.0
  beta_occ_2_sf: 0.0
  beta_occ_3_sf: 0.0
  beta_occ_4_sf: 0.0
  beta_occ_2_cm: 0.0
  beta_occ_3_cm: 0.0
  beta_occ_4_cm: 0.0
  beta_occ_2_cf: 0.0
  beta_occ_3_cf: 0.0
  beta_occ_4_cf: 0.0

  sigma: 0.5

optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 6000
  tolerance: 1.0e-8
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    # Box-Cox exponents.
    theta_l_sm: [-8.0, 0.95]
    theta_l_sf: [-8.0, 0.95]
    theta_l_m:  [-8.0, 0.95]
    theta_l_f:  [-8.0, 0.95]
    theta_c_singles: [-8.0, 0.95]   # NEW M0a-clean: singles-shared
    theta_c:    [-8.0, 0.95]        # couples shared (UNCHANGED)
    # REMOVED at M0a-clean: theta_c_sm, theta_c_sf bounds.

    # Preference scales.
    beta_c_sm: [0.05, 50.0]
    beta_c_sf: [0.05, 50.0]
    beta_c:    [0.05, 50.0]
    beta_l0_sm: [0.05, 50.0]
    beta_l0_sf: [0.05, 50.0]
    beta_l0_m:  [0.05, 50.0]
    beta_l0_f:  [0.05, 50.0]

    # Leisure shifters (beta_l_educH_* removed at M0a).
    beta_l_age_sm:   [-5.0, 5.0]
    beta_l_age2_sm:  [-1.0, 1.0]
    beta_l_age_sf:   [-5.0, 5.0]
    beta_l_age2_sf:  [-1.0, 1.0]
    beta_l_age_m:    [-5.0, 5.0]
    beta_l_age2_m:   [-1.0, 1.0]
    beta_l_age_f:    [-5.0, 5.0]
    beta_l_age2_f:   [-1.0, 1.0]
    beta_l_nkids_sf: [-5.0, 5.0]
    beta_l_nkids_f:  [-5.0, 5.0]

    # Employment intercept and hours focal-point shifters.
    beta_E:     [-25.0, 25.0]
    beta_h_pt1: [-10.0, 10.0]
    beta_h_pt2: [-10.0, 10.0]
    beta_h_ft:  [-10.0, 10.0]

    # Wage opportunity Mincer mean.
    beta_w0:       [-10.0, 20.0]
    beta_w_educL:  [-5.0, 5.0]
    beta_w_educH:  [-5.0, 5.0]
    beta_w_pexp:   [-1.0, 1.0]
    beta_w_pexp2:  [-0.1, 0.1]

    # Market opportunity residual.
    beta_E_gsur:  [-10.0, 10.0]
    beta_E_educH: [-10.0, 10.0]

    # Occupation opportunity (reference loc4=1).
    beta_occ_2_sm: [-10.0, 10.0]
    beta_occ_3_sm: [-10.0, 10.0]
    beta_occ_4_sm: [-10.0, 10.0]
    beta_occ_2_sf: [-10.0, 10.0]
    beta_occ_3_sf: [-10.0, 10.0]
    beta_occ_4_sf: [-10.0, 10.0]
    beta_occ_2_cm: [-10.0, 10.0]
    beta_occ_3_cm: [-10.0, 10.0]
    beta_occ_4_cm: [-10.0, 10.0]
    beta_occ_2_cf: [-10.0, 10.0]
    beta_occ_3_cf: [-10.0, 10.0]
    beta_occ_4_cf: [-10.0, 10.0]

    sigma: [0.1, 20.0]

  expression_constraints:
    enabled: true
    default_mode: soft
    default_weight: 1000.0
    constraints:
      # REMOVED at M0a-clean: theta_c_singles_pool (the equality-constraint
      # fallback used in ruro_occ_M0a). It is now achieved by the
      # renamed shared parameter `theta_c_singles` above, which the parser
      # and both engines route to both singles groups.
      - name: mul_cou_m_positive
        expression: mul
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6
      - name: mul_cou_f_positive
        expression: mul
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6

gradient_verification:
  enabled: false
