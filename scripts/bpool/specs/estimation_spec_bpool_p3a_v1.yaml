# ==============================================================================
# B-pool P3a estimation spec — v1
# ==============================================================================
# Derived from estimation_spec_ruro_occ_P3a_pooled.yaml (55 params).
#
# One addition relative to P3a pooled:
#   beta_h_lh ADDED.  Long-hours increment in the hours-opportunity block.
#   Variable: working_lh = 1 iff (working==1 AND hours in [44.5,70.0]).
#   F35 [33.5,36.5) remains the REFERENCE category (no working_f35 flag).
#   Hours-opportunity flags: working_pt1, working_pt2, working_ft, working_lh.
#   F35 alternatives enter only via beta_E (the intercept).
#
# Parameter count: 58 (55 P3a pooled + beta_h_lh + beta_E_drgur + beta_E_drgmd).
#   Urbanisation access increment (D5): drgur (urban) + drgmd (middle) into the
#   market-opportunity block; RURAL (drgru) is the dropped reference. Access-only.
#
# Data input: U:/EUROMOD-STORAGE/new_data/fr_p3a_bpool_d1w1__singles.parquet
#             U:/EUROMOD-STORAGE/new_data/fr_p3a_bpool_d1w1__couples.parquet
#   provisioning_label: bpool_d1w1_gsurv2_opportunity_year_aligned
#   B-ladder rung: B1 (singles) / B2 (couples product 30×30=900)
#   Draws: D1 focal-mode hours + W1 occupation-conditional wages + empirical loc4
#
# Changes vs estimation_spec_ruro_occ_P3a_pooled.yaml:
#   1. specification.name  -> "bpool_p3a_v1"
#   2. specification.description -> updated
#   3. hours_opportunity.shifters: added beta_h_lh entry (after beta_h_ft)
#   4. initial_values: added beta_h_lh: 0.0
#   5. optimization.bounds: added beta_h_lh: [-10.0, 10.0]
#   6. market_opportunity.shifters: added drgur->beta_E_drgur and drgmd->beta_E_drgmd
#      (urbanisation access increment, D5; rural=drgru is the dropped reference),
#      interaction:["working"], applies_to:"household". +initial_values 0.0, bounds [-10,10].
#   Everything else byte-identical to P3a pooled.
#
# Reference docs:
#   docs/France_case/_shared/governance/RURO_spec_redesign_decisions_v2.md §D1
#   docs/France_case/P3a/execution_logs/Bpool/RURO_Bpool_draws_verification_v1.md
#   scripts/enhanced/specifications/estimation_spec_ruro_occ_P3a_pooled.yaml
# ==============================================================================

specification:
  name: "bpool_p3a_v1"
  description: "B-pool P3a v1: P3a pooled specification on B-pool D1+W1 draws. Adds beta_h_lh (long-hours increment, LH=[44.5,70]) to the hours-opportunity block. F35=[33.5,36.5) remains the reference category with no flag. Hours flags: pt1, pt2, ft, lh. Adds urbanisation access increment (D5): beta_E_drgur (urban) + beta_E_drgmd (middle) in the market-opportunity block, RURAL (drgru) = dropped reference, access-only. 58 free parameters = 55 P3a pooled + beta_h_lh + beta_E_drgur + beta_E_drgmd. Data: bpool_d1w1_gsurv2_opportunity_year_aligned draws."
  wage_spec: "vw"
  model_family: "regular"

utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"
    singles_box_cox_exponent: "theta_c_singles"
    couples_fixed_box_cox_exponent: 0.0
    box_cox_bounds: [-8.0, 0.95]

  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"
    box_cox_bounds: [-8.0, 0.95]
    shifters:
      - variable: "age_norm"
        coefficient: "beta_l_age"
      - variable: "age_norm2"
        coefficient: "beta_l_age2"
      - variable: "n_children"
        coefficient: "beta_l_nkids"
        gender_specific: true   # female only

hours_opportunity:
  shifters:
    - variable: "working"
      coefficient: "beta_E"
    - variable: "working_pt1"
      coefficient: "beta_h_pt1"
    - variable: "working_pt2"
      coefficient: "beta_h_pt2"
    - variable: "working_ft"
      coefficient: "beta_h_ft"
    - variable: "working_lh"
      coefficient: "beta_h_lh"   # NEW: long-hours [44.5,70]; F35 remains reference

wage_opportunity:
  specification: "log_normal"
  mean_shifters:
    - variable: "intercept"
      coefficient: "beta_w0"
    - variable: "educL"
      coefficient: "beta_w_educL"
    - variable: "educH"
      coefficient: "beta_w_educH"
    - variable: "pexp_years"
      coefficient: "beta_w_pexp"
    - variable: "pexp_years2"
      coefficient: "beta_w_pexp2"
  variance:
    parameter: "sigma"

market_opportunity:
  applies_to: "both"
  employment_indicator: "working"
  gsur_variable: "gsur"
  offer_only_vars: ["gsur"]
  center_within_choice_set: true
  center_weights: "proposal"
  variable_scales:
    gsur: 10.0

  shifters:
    - variable: "gsur"
      coefficient: "beta_E_gsur"
      interaction: ["working"]
    - variable: "reg2"
      coefficient: "beta_E_drgn2"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg3"
      coefficient: "beta_E_drgn3"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg4"
      coefficient: "beta_E_drgn4"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg5"
      coefficient: "beta_E_drgn5"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg6"
      coefficient: "beta_E_drgn6"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg7"
      coefficient: "beta_E_drgn7"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg8"
      coefficient: "beta_E_drgn8"
      interaction: ["working"]
      applies_to: "household"
    - variable: "year_2015_indicator"
      coefficient: "beta_E_y2015"
      interaction: ["working"]
      applies_to: "household"
    - variable: "year_2017_indicator"
      coefficient: "beta_E_y2017"
      interaction: ["working"]
      applies_to: "household"
    # Urbanisation (D5): access-only increment. drgur=urban (db100==1),
    # drgmd=middle (db100==2); RURAL (drgru, db100==3) is the dropped reference.
    # Interpretation: urban / middle access RELATIVE TO rural. +2 df.
    - variable: "drgur"
      coefficient: "beta_E_drgur"
      interaction: ["working"]
      applies_to: "household"
    - variable: "drgmd"
      coefficient: "beta_E_drgmd"
      interaction: ["working"]
      applies_to: "household"

occupation_opportunity:
  variable: "loc4"
  reference: 1
  shifters:
    - variable: "loc4_2"
      coefficient: "beta_occ_2_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_cf"
      applies_to: "cf"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_cf"
      applies_to: "cf"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_cf"
      applies_to: "cf"
      interaction: ["working"]

couples:
  leisure_interaction:
    coefficient: "beta_ll"

# 58 free parameters (was 56; +2 urbanisation access increment, D5):
# Singles leisure: beta_l0_sm, beta_l_age_sm, beta_l_age2_sm, beta_c_sm, theta_l_sm  [5]
#                  beta_l0_sf, beta_l_age_sf, beta_l_age2_sf, beta_l_nkids_sf, beta_c_sf, theta_l_sf  [6]
#                  theta_c_singles  [1]
# Couples leisure: beta_l0_m, beta_l_age_m, beta_l_age2_m, theta_l_m  [4]
#                  beta_l0_f, beta_l_age_f, beta_l_age2_f, beta_l_nkids_f, theta_l_f  [5]
#                  beta_c  [1]  (theta_c FIXED at 0.0)
# Hours opp:  beta_E, beta_h_pt1, beta_h_pt2, beta_h_ft, beta_h_lh  [5]
# Market opp: beta_E_gsur, beta_E_drgn2..8, beta_E_y2015, beta_E_y2017,
#             beta_E_drgur, beta_E_drgmd  [12]   <- +2 urbanisation (rural=reference)
# Occ opp:    beta_occ_{2,3,4}_{sm,sf,cm,cf}  [12]
# Wage:       beta_w0, beta_w_educL, beta_w_educH, beta_w_pexp, beta_w_pexp2, sigma  [6]
# Couples:    beta_ll  [1]
# TOTAL: 5+6+1+4+5+1+5+12+12+6+1 = 58
# Urbanisation: drgur (urban, db100==1) + drgmd (middle, db100==2); RURAL (drgru,
# db100==3) is the dropped reference. Access-only (market-opp / offer margin), one
# increment, per RURO_spec_redesign_decisions_v2.md §D5 / §D10 guardrails.

initial_values:
  beta_l0_sm: 1.0
  beta_l_age_sm: 0.0
  beta_l_age2_sm: 0.0
  beta_c_sm: 1.0
  theta_l_sm: -1.0

  beta_l0_sf: 1.0
  beta_l_age_sf: 0.0
  beta_l_age2_sf: 0.0
  beta_l_nkids_sf: 0.0
  beta_c_sf: 1.0
  theta_l_sf: -1.0

  theta_c_singles: -1.0

  beta_l0_m: 0.01
  beta_l_age_m: 0.0
  beta_l_age2_m: 0.0
  theta_l_m: -1.0

  beta_l0_f: 1.0
  beta_l_age_f: 0.0
  beta_l_age2_f: 0.0
  beta_l_nkids_f: 0.0
  theta_l_f: -1.0

  beta_c: 1.0
  # theta_c is NOT listed — fixed at 0.0 and not estimated.

  beta_E:     0.0
  beta_h_pt1: 0.0
  beta_h_pt2: 0.0
  beta_h_ft:  0.0
  beta_h_lh:  0.0   # NEW: long-hours increment; F35 reference unchanged

  beta_E_gsur:   0.0
  beta_E_drgn2:  0.0
  beta_E_drgn3:  0.0
  beta_E_drgn4:  0.0
  beta_E_drgn5:  0.0
  beta_E_drgn6:  0.0
  beta_E_drgn7:  0.0
  beta_E_drgn8:  0.0
  beta_E_y2015:  0.0
  beta_E_y2017:  0.0

  beta_E_drgur:  0.0   # NEW (D5): urban access vs rural (reference)
  beta_E_drgmd:  0.0   # NEW (D5): middle-density access vs rural (reference)

  beta_w0:       2.0
  beta_w_educL: -0.1
  beta_w_educH:  0.2
  beta_w_pexp:   0.02
  beta_w_pexp2: -0.0003

  beta_occ_2_sm: 0.0
  beta_occ_3_sm: 0.0
  beta_occ_4_sm: 0.0
  beta_occ_2_sf: 0.0
  beta_occ_3_sf: 0.0
  beta_occ_4_sf: 0.0
  beta_occ_2_cm: 0.0
  beta_occ_3_cm: 0.0
  beta_occ_4_cm: 0.0
  beta_occ_2_cf: 0.0
  beta_occ_3_cf: 0.0
  beta_occ_4_cf: 0.0

  sigma: 0.5

  beta_ll: 2.0

optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 6000
  tolerance: 1.0e-8
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    theta_l_sm: [-8.0, 0.95]
    theta_l_sf: [-8.0, 0.95]
    theta_l_m:  [-8.0, 0.95]
    theta_l_f:  [-8.0, 0.95]
    theta_c_singles: [-8.0, 0.95]
    # theta_c NOT listed — fixed at 0.0, not estimated.

    beta_c_sm: [0.05, 50.0]
    beta_c_sf: [0.05, 50.0]
    beta_c:    [0.05, 50.0]
    beta_l0_sm: [0.05, 50.0]
    beta_l0_sf: [0.05, 50.0]
    beta_l0_m:  [1.0e-6, 50.0]
    beta_l0_f:  [0.05, 50.0]

    beta_l_age_sm:   [-5.0, 5.0]
    beta_l_age2_sm:  [-1.0, 1.0]
    beta_l_age_sf:   [-5.0, 5.0]
    beta_l_age2_sf:  [-1.0, 1.0]
    beta_l_age_m:    [-5.0, 5.0]
    beta_l_age2_m:   [-1.0, 1.0]
    beta_l_age_f:    [-5.0, 5.0]
    beta_l_age2_f:   [-1.0, 1.0]
    beta_l_nkids_sf: [-5.0, 5.0]
    beta_l_nkids_f:  [-5.0, 5.0]

    beta_E:     [-25.0, 25.0]
    beta_h_pt1: [-10.0, 10.0]
    beta_h_pt2: [-10.0, 10.0]
    beta_h_ft:  [-10.0, 10.0]
    beta_h_lh:  [-10.0, 10.0]   # NEW

    beta_w0:       [-10.0, 20.0]
    beta_w_educL:  [-5.0, 5.0]
    beta_w_educH:  [-5.0, 5.0]
    beta_w_pexp:   [-1.0, 1.0]
    beta_w_pexp2:  [-0.1, 0.1]

    beta_E_gsur:   [-10.0, 10.0]
    beta_E_drgn2:  [-10.0, 10.0]
    beta_E_drgn3:  [-10.0, 10.0]
    beta_E_drgn4:  [-10.0, 10.0]
    beta_E_drgn5:  [-10.0, 10.0]
    beta_E_drgn6:  [-10.0, 10.0]
    beta_E_drgn7:  [-10.0, 10.0]
    beta_E_drgn8:  [-10.0, 10.0]
    beta_E_y2015:  [-5.0, 5.0]
    beta_E_y2017:  [-5.0, 5.0]

    beta_E_drgur:  [-10.0, 10.0]   # NEW (D5)
    beta_E_drgmd:  [-10.0, 10.0]   # NEW (D5)

    beta_occ_2_sm: [-10.0, 10.0]
    beta_occ_3_sm: [-10.0, 10.0]
    beta_occ_4_sm: [-10.0, 10.0]
    beta_occ_2_sf: [-10.0, 10.0]
    beta_occ_3_sf: [-10.0, 10.0]
    beta_occ_4_sf: [-10.0, 10.0]
    beta_occ_2_cm: [-10.0, 10.0]
    beta_occ_3_cm: [-10.0, 10.0]
    beta_occ_4_cm: [-10.0, 10.0]
    beta_occ_2_cf: [-10.0, 10.0]
    beta_occ_3_cf: [-10.0, 10.0]
    beta_occ_4_cf: [-10.0, 10.0]

    sigma: [0.1, 20.0]

    beta_ll: [0.0, 10.0]

  expression_constraints:
    enabled: true
    default_mode: soft
    default_weight: 1000.0
    constraints:
      - name: mul_cou_m_positive
        expression: mul
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6
      - name: mul_cou_f_positive
        expression: mul
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6

gradient_verification:
  enabled: false
