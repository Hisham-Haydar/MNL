# ==============================================================================
# RURO MNL Estimation Specification - Occupation Choice Model
# ==============================================================================
# Based on Aaberge & Colombino (2011) sector choice framework
# This specification treats occupation as a CHOICE DIMENSION alongside hours and wages
#
# OCCUPATION STRUCTURE (loc4 - France 2016 pipeline):
# - loc4_1: Routine manual (reference category) - ISCO 6,7,8: Craft, Plant, Elementary
# - loc4_2: Nonroutine manual - ISCO 5: Service/Sales workers
# - loc4_3: Routine cognitive - ISCO 4: Clerical support workers
# - loc4_4: Nonroutine cognitive - ISCO 1,2,3: Managers, Professionals, Technicians
#
# HOURS PEAKS (weekly hours matching base specification):
# - PT1: 18.5-20.5 hours/week (focal point ~20h)
# - PT2: 29.5-30.5 hours/week (focal point ~30h)
# - FT: 37.5-40.5 hours/week (focal point ~40h)
#
# CHOICE SET: 400 alternatives = 100 hours × 4 occupations
# Each occupation has its own wage and hour opportunity distributions
# ==============================================================================

specification:
  name: "occupation_choice_ruro"
  description: "Full occupation choice model with occupation-specific wage and hour opportunities"
  wage_spec: "vw_occupation"  # Occupation-specific virtual wage
  occupation_choice: true  # NEW FLAG: Enable occupation as choice dimension

# Utility Function (Preference Side)
utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"  # Group-specific (will create _sm, _sf, _m, _f)
    box_cox_exponent: null  # Log utility for consumption

  leisure:
    intercept: "beta_l0"  # Base leisure preference
    box_cox_exponent: null  # Log utility for leisure
    shifters:
      # Occupation-specific leisure preferences (relative to Routine manual = loc4_1)
      - variable: "loc4_2"
        coefficient: "beta_l_nm"
        description: "Leisure preference in Nonroutine manual occupations"

      - variable: "loc4_3"
        coefficient: "beta_l_rc"
        description: "Leisure preference in Routine cognitive occupations"

      - variable: "loc4_4"
        coefficient: "beta_l_nc"
        description: "Leisure preference in Nonroutine cognitive occupations"

# Occupation Preferences (direct occupation utility)
occupation_preferences:
  # Routine manual (loc4_1) is the reference category (utility = 0)

  - occupation: "loc4_2"  # Nonroutine manual
    coefficient: "alpha_nm"
    description: "Base preference for Nonroutine manual occupations"
    interactions:
      - variable: "education"  # Years of schooling or education level
        coefficient: "alpha_nm_educ"
        description: "Education effect on Nonroutine manual preference"

      - variable: "age"
        coefficient: "alpha_nm_age"
        description: "Age effect on Nonroutine manual preference"

  - occupation: "loc4_3"  # Routine cognitive
    coefficient: "alpha_rc"
    description: "Base preference for Routine cognitive occupations"
    interactions:
      - variable: "education"  # Years of schooling or education level
        coefficient: "alpha_rc_educ"
        description: "Education effect on Routine cognitive preference"

      - variable: "age"
        coefficient: "alpha_rc_age"
        description: "Age effect on Routine cognitive preference"

  - occupation: "loc4_4"  # Nonroutine cognitive
    coefficient: "alpha_nc"
    description: "Base preference for Nonroutine cognitive occupations"
    interactions:
      - variable: "education"  # Years of schooling or education level
        coefficient: "alpha_nc_educ"
        description: "Education effect on Nonroutine cognitive preference"

      - variable: "age"
        coefficient: "alpha_nc_age"
        description: "Age effect on Nonroutine cognitive preference"

# Hours Opportunity Density (Occupation-Specific)
hours_opportunity:
  occupation_specific: true

  # Three focal peaks by occupation matching base specification
  occupations:
    - occupation: "loc4_1"  # Routine manual
      part_time_1_peak: "pi_pt1_rm"  # Peak at ~20h/week (18.5-20.5)
      part_time_2_peak: "pi_pt2_rm"  # Peak at ~30h/week (29.5-30.5)
      full_time_peak: "pi_ft_rm"      # Peak at ~40h/week (37.5-40.5)
      description: "Routine manual: high PT1/PT2, moderate FT"

    - occupation: "loc4_2"  # Nonroutine manual
      part_time_1_peak: "pi_pt1_nm"
      part_time_2_peak: "pi_pt2_nm"
      full_time_peak: "pi_ft_nm"
      description: "Nonroutine manual: high PT1/PT2, moderate FT"

    - occupation: "loc4_3"  # Routine cognitive
      part_time_1_peak: "pi_pt1_rc"
      part_time_2_peak: "pi_pt2_rc"
      full_time_peak: "pi_ft_rc"
      description: "Routine cognitive: moderate PT1/PT2, high FT"

    - occupation: "loc4_4"  # Nonroutine cognitive
      part_time_1_peak: "pi_pt1_nc"
      part_time_2_peak: "pi_pt2_nc"
      full_time_peak: "pi_ft_nc"
      description: "Nonroutine cognitive: low PT1/PT2, very high FT"

  shifters:
    - variable: "working"
      coefficient: "beta_work"
      description: "Working indicator (h>0)"

# Wage Opportunity Density (Occupation-Specific Mincer Equations)
wage_opportunity:
  specification: "occupation_specific_log_normal"

  occupations:
    - occupation: "loc4_1"  # Routine manual
      intercept: "beta_w0_rm"
      experience: "beta_w_exp_rm"
      experience_squared: "beta_w_exp2_rm"
      education: "beta_w_ed_rm"
      variance: "sigma_rm"
      description: "Lowest wages, low returns to education"

    - occupation: "loc4_2"  # Nonroutine manual
      intercept: "beta_w0_nm"
      experience: "beta_w_exp_nm"
      experience_squared: "beta_w_exp2_nm"
      education: "beta_w_ed_nm"
      variance: "sigma_nm"
      description: "Low-medium wages, moderate returns to education"

    - occupation: "loc4_3"  # Routine cognitive
      intercept: "beta_w0_rc"
      experience: "beta_w_exp_rc"
      experience_squared: "beta_w_exp2_rc"
      education: "beta_w_ed_rc"
      variance: "sigma_rc"
      description: "Medium wages, moderate returns to education"

    - occupation: "loc4_4"  # Nonroutine cognitive
      intercept: "beta_w0_nc"
      experience: "beta_w_exp_nc"
      experience_squared: "beta_w_exp2_nc"
      education: "beta_w_ed_nc"
      variance: "sigma_nc"
      description: "Highest wages, high returns to education"

# Market Opportunity (Occupation Availability)
market_opportunity:
  # Probability that occupation is available (relative odds)
  occupation_availability:
    - occupation: "loc4_1"  # Routine manual (reference)
      parameter: null  # Reference category (μ_rm = 0)
      description: "Availability of routine manual positions (reference)"

    - occupation: "loc4_2"  # Nonroutine manual
      parameter: "mu_nm"
      description: "Availability of nonroutine manual positions"

    - occupation: "loc4_3"  # Routine cognitive
      parameter: "mu_rc"
      description: "Availability of routine cognitive positions"

    - occupation: "loc4_4"  # Nonroutine cognitive
      parameter: "mu_nc"
      description: "Availability of nonroutine cognitive positions"

# Singles/Couples Configuration
singles:
  gender_specific_leisure: true
  gender_specific_consumption: true
  occupation_choice: true  # Both singles and couples choose occupation

couples:
  gender_specific_leisure: true
  gender_specific_consumption: false  # Shared consumption
  leisure_interaction:
    coefficient: "beta_interact"  # Matches base specification
  occupation_choice: true  # Both spouses choose occupation independently

# Parameter Initialization
# Format: parameter_name_{occupation}_{gender}
initial_values:
  # === Leisure Intercepts (by gender) ===
  beta_l0_sm: 0.35
  beta_l0_sf: 1.01
  beta_l0_m: 0.35
  beta_l0_f: 1.01

  # === Occupation-specific leisure shifters ===
  # Nonroutine manual (loc4_2)
  beta_l_nm_sm: 0.0
  beta_l_nm_sf: 0.0
  beta_l_nm_m: 0.0
  beta_l_nm_f: 0.0

  # Routine cognitive (loc4_3)
  beta_l_rc_sm: 0.0
  beta_l_rc_sf: 0.0
  beta_l_rc_m: 0.0
  beta_l_rc_f: 0.0

  # Nonroutine cognitive (loc4_4)
  beta_l_nc_sm: 0.0
  beta_l_nc_sf: 0.0
  beta_l_nc_m: 0.0
  beta_l_nc_f: 0.0

  # === Consumption ===
  beta_c_sm: 1.0
  beta_c_sf: 0.75
  beta_c: 1.25  # Couples

  # === Occupation Preferences (Singles Male) ===
  alpha_nm_sm: 0.0
  alpha_nm_educ_sm: 0.0
  alpha_nm_age_sm: 0.0

  alpha_rc_sm: 0.0
  alpha_rc_educ_sm: 0.3
  alpha_rc_age_sm: 0.0

  alpha_nc_sm: 0.0
  alpha_nc_educ_sm: 0.5
  alpha_nc_age_sm: 0.0

  # === Occupation Preferences (Singles Female) ===
  alpha_nm_sf: 0.0
  alpha_nm_educ_sf: 0.0
  alpha_nm_age_sf: 0.0

  alpha_rc_sf: 0.0
  alpha_rc_educ_sf: 0.3
  alpha_rc_age_sf: 0.0

  alpha_nc_sf: 0.0
  alpha_nc_educ_sf: 0.5
  alpha_nc_age_sf: 0.0

  # === Occupation Preferences (Couples Male) ===
  alpha_nm_m: 0.0
  alpha_nm_educ_m: 0.0
  alpha_nm_age_m: 0.0

  alpha_rc_m: 0.0
  alpha_rc_educ_m: 0.3
  alpha_rc_age_m: 0.0

  alpha_nc_m: 0.0
  alpha_nc_educ_m: 0.5
  alpha_nc_age_m: 0.0

  # === Occupation Preferences (Couples Female) ===
  alpha_nm_f: 0.0
  alpha_nm_educ_f: 0.0
  alpha_nm_age_f: 0.0

  alpha_rc_f: 0.0
  alpha_rc_educ_f: 0.3
  alpha_rc_age_f: 0.0

  alpha_nc_f: 0.0
  alpha_nc_educ_f: 0.5
  alpha_nc_age_f: 0.0

  # === Hours Opportunity (by occupation) ===
  # Routine manual (loc4_1)
  pi_pt1_rm: 1.5
  pi_pt2_rm: 1.8
  pi_ft_rm: 1.2

  # Nonroutine manual (loc4_2)
  pi_pt1_nm: 1.5
  pi_pt2_nm: 1.8
  pi_ft_nm: 1.3

  # Routine cognitive (loc4_3)
  pi_pt1_rc: 1.0
  pi_pt2_rc: 1.3
  pi_ft_rc: 1.8

  # Nonroutine cognitive (loc4_4)
  pi_pt1_nc: 0.3
  pi_pt2_nc: 0.5
  pi_ft_nc: 2.0

  beta_work: 1.395

  # === Wage Opportunity (Routine manual - loc4_1) ===
  # log(wage) ~ N(β0 + β_exp*(exp/10) + β_exp2*(exp/10)² + β_ed*ed, σ²)
  # Expected wage: exp(2.7 + 0.19*1.5 - 0.03*2.25 + 0.03*1) ≈ 17 EUR/hr
  beta_w0_rm_sm: 2.7
  beta_w_exp_rm_sm: 0.19
  beta_w_exp2_rm_sm: -0.03
  beta_w_ed_rm_sm: 0.03
  sigma_rm_sm: 0.24

  beta_w0_rm_sf: 2.6
  beta_w_exp_rm_sf: 0.17
  beta_w_exp2_rm_sf: -0.02
  beta_w_ed_rm_sf: 0.03
  sigma_rm_sf: 0.22

  # === Wage Opportunity (Nonroutine manual - loc4_2) ===
  # Expected wage: exp(2.8 + 0.20*1.5 - 0.03*2.25 + 0.04*2) ≈ 19 EUR/hr
  beta_w0_nm_sm: 2.8
  beta_w_exp_nm_sm: 0.20
  beta_w_exp2_nm_sm: -0.03
  beta_w_ed_nm_sm: 0.04
  sigma_nm_sm: 0.25

  beta_w0_nm_sf: 2.7
  beta_w_exp_nm_sf: 0.18
  beta_w_exp2_nm_sf: -0.03
  beta_w_ed_nm_sf: 0.04
  sigma_nm_sf: 0.23

  # === Wage Opportunity (Routine cognitive - loc4_3) ===
  # Expected wage: exp(2.9 + 0.21*1.5 - 0.03*2.25 + 0.04*2) ≈ 22 EUR/hr
  beta_w0_rc_sm: 2.9
  beta_w_exp_rc_sm: 0.21
  beta_w_exp2_rc_sm: -0.03
  beta_w_ed_rc_sm: 0.04
  sigma_rc_sm: 0.26

  beta_w0_rc_sf: 2.8
  beta_w_exp_rc_sf: 0.19
  beta_w_exp2_rc_sf: -0.03
  beta_w_ed_rc_sf: 0.04
  sigma_rc_sf: 0.24

  # === Wage Opportunity (Nonroutine cognitive - loc4_4) ===
  # Expected wage: exp(3.1 + 0.23*1.5 - 0.04*2.25 + 0.05*3) ≈ 28 EUR/hr
  beta_w0_nc_sm: 3.1
  beta_w_exp_nc_sm: 0.23
  beta_w_exp2_nc_sm: -0.04
  beta_w_ed_nc_sm: 0.05
  sigma_nc_sm: 0.28

  beta_w0_nc_sf: 3.0
  beta_w_exp_nc_sf: 0.21
  beta_w_exp2_nc_sf: -0.03
  beta_w_ed_nc_sf: 0.05
  sigma_nc_sf: 0.26

  # === Market Opportunity (Occupation Availability) ===
  # mu_rm is reference (= 0) - Routine manual is most common
  mu_nm_sm: -0.5  # Nonroutine manual somewhat common
  mu_rc_sm: -1.0  # Routine cognitive moderately rare
  mu_nc_sm: -1.5  # Nonroutine cognitive rarest

  mu_nm_sf: -0.3  # Female nonroutine manual more common
  mu_rc_sf: -0.8  # Female routine cognitive moderately rare
  mu_nc_sf: -1.2  # Female nonroutine cognitive rare

  # === Couples Leisure Interaction ===
  beta_interact: -0.5534  # Matches base specification (negative = substitutes)

# Optimization Settings
optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 2000
  tolerance: 1.0e-6
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    # Wage variances must be positive
    sigma_rm_sm: [0.1, 1.0]
    sigma_rm_sf: [0.1, 1.0]
    sigma_nm_sm: [0.1, 1.0]
    sigma_nm_sf: [0.1, 1.0]
    sigma_rc_sm: [0.1, 1.0]
    sigma_rc_sf: [0.1, 1.0]
    sigma_nc_sm: [0.1, 1.0]
    sigma_nc_sf: [0.1, 1.0]

# McFadden Sampling Configuration
sampling:
  method: "mcfadden_occupation"
  n_alternatives_per_occupation: 100  # 100 hour alternatives per occupation
  total_alternatives: 400  # 100 hours × 4 occupations
  include_observed: true
  stratified_by_occupation: true

  description: |
    For each individual, create a choice set of 400 alternatives:
    - 1 observed choice (h_obs, w_obs, occ_obs)
    - 99 sampled alternatives in observed occupation
    - 100 sampled alternatives in each of the other 3 occupations

    Each alternative is sampled from occupation-specific (h, w) distributions.
