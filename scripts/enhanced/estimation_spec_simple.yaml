# ==============================================================================
# RURO MNL Estimation Specification - Simple (VW)
# ==============================================================================
# Goal: start with a minimal, stable specification and add complexity later.
# - Box-Cox utility retained (engine only supports box_cox)
# - Leisure shifters: age_norm + n_children (female only)
# - Hours opportunity: working + focal hours only
# - Wage equation: intercept + educL/educH + pexp (no pexp2)
# - No GSUR, no region, no gender/couple interactions in hours
# - No couples leisure interaction term
# ==============================================================================

specification:
  name: "simple_vw"
  description: "Simple VW spec: minimal shifters, focal hours only"
  wage_spec: "vw"  # fw | vw | loc_empirical

# ------------------------------------------------------------------------------
# Utility Function (Preference Side)
# ------------------------------------------------------------------------------
utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"

  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"

    shifters:
      - variable: "age_norm"
        coefficient: "beta_l_age_norm"
        description: "Age effect (demeaned)"

      - variable: "n_children"
        coefficient: "beta_l_n_children"
        description: "Number of children effect"
        gender_specific: true

# ------------------------------------------------------------------------------
# Hours Opportunity Density (log h(h|X))
# ------------------------------------------------------------------------------
hours_opportunity:
  shifters:
    - variable: "working"
      coefficient: "beta_work"
      description: "Working indicator (h>0)"

    - variable: "working_pt1"
      coefficient: "beta_pt1"
      description: "Part-time 1 focal point (~20h)"

    - variable: "working_pt2"
      coefficient: "beta_pt2"
      description: "Part-time 2 focal point (~30h)"

    - variable: "working_ft"
      coefficient: "beta_ft"
      description: "Full-time focal point (~40h)"

# ------------------------------------------------------------------------------
# Wage Opportunity Density (log w(w|X)) - Mincer Equation
# ------------------------------------------------------------------------------
wage_opportunity:
  specification: "log_normal"

  mean_shifters:
    - variable: "intercept"
      coefficient: "beta_w0"
      description: "Log-wage intercept"

    - variable: "educL"
      coefficient: "beta_w_educL"
      description: "Low education wage penalty"

    - variable: "educH"
      coefficient: "beta_w_educH"
      description: "High education wage premium"

    - variable: "pexp_years"
      coefficient: "beta_pexp"
      description: "Experience (linear term)"

  variance:
    parameter: "sigma"
    description: "Standard deviation of log-wage residual"
    bounds: [0.1, 20.0]

# ------------------------------------------------------------------------------
# Singles/Couples sections (kept for compatibility)
# ------------------------------------------------------------------------------
singles:
  gender_specific_leisure: true

couples:
  gender_specific_leisure: true

# ------------------------------------------------------------------------------
# Parameter Initialization (reuse base values; extra entries are ignored)
# ------------------------------------------------------------------------------
initial_values:
  beta_l0_sm: 0.4179
  beta_l_age_norm_sm: -0.0076
  beta_l_age_norm2_sm: -0.0017
  beta_l_educL_sm: 0.1389
  beta_l_educH_sm: -0.3457
  beta_c_sm: 1.0399
  theta_l_sm: 0.001
  theta_c_sm: 0.2628

  beta_l0_sf: 0.6778
  beta_l_age_norm_sf: -0.0208
  beta_l_age_norm2_sf: -0.0006
  beta_l_n_children_sf: 0.2244
  beta_l_educL_sf: 0.1394
  beta_l_educH_sf: -0.4689
  beta_c_sf: 0.7602
  theta_l_sf: 0.0352
  theta_c_sf: 0.5345

  beta_l0_m: 0.2886
  beta_l_age_norm_m: -0.0031
  beta_l_age_norm2_m: -0.0027
  beta_l_educL_m: 0.1749
  beta_l_educH_m: -0.7092
  theta_l_m: 0.0968

  beta_l0_f: 1.3515
  beta_l_age_norm_f: -0.0334
  beta_l_age_norm2_f: -0.0006
  beta_l_n_children_f: 0.1
  beta_l_educL_f: 0.1644
  beta_l_educH_f: -0.2558
  theta_l_f: 0.001

  beta_c: 1.2740
  theta_c: 0.2926

  beta_work: 1.3950
  beta_pt1: 1.3308
  beta_pt2: 1.9189
  beta_ft: 2.9088
  beta_gsur: 0.0
  beta_work_educL: -0.4419
  beta_work_educH: 0.7037
  beta_work_female: 0.0
  beta_work_couple: 0.0
  beta_work_idf: 0.0

  beta_w0: 2.1850
  beta_w_educL: -0.0332
  beta_w_educH: 0.2865
  beta_pexp: 0.0032
  beta_pexp2: 0.0
  sigma: 0.4723

  beta_interact: -0.5534

# ------------------------------------------------------------------------------
# Optimization Settings
# ------------------------------------------------------------------------------
optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 10000
  tolerance: 1.0e-9
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    theta_l_sm: [0.0, 5.0]
    theta_c_sm: [0.0, 5.0]
    theta_l_sf: [0.0, 5.0]
    theta_c_sf: [0.0, 5.0]
    theta_l_m: [0.0, 5.0]
    theta_l_f: [0.0, 5.0]
    theta_c: [0.0, 5.0]
    sigma: [0.1, 20.0]

# ------------------------------------------------------------------------------
# Gradient Verification (Debugging/Validation)
# ------------------------------------------------------------------------------
gradient_verification:
  enabled: true
  method: "central"
  epsilon: 1.0e-7
  tolerance: 1.0e-4
  check_at_init: true
  check_random_points: 0
  random_seed: 42
  verbose: true

