# config/multi_year/fr_p3a_gsurv2_stage_m1.yaml
# ==============================================
# Stage M1 configuration — France P3a GSURv2 re-run (2015+2016+2017)
#
# Dedicated config for the Stage M1 P3a GSURv2 stacking re-run.
# Differs from fr_p3a_stage_m1.yaml ONLY in:
#   (a) input_parquet_patterns — exact GSURv2 stems only; no broad glob
#   (b) output_file_stems — fr_p3a_gsurv2_stacked_raw / fr_p3a_gsurv2_harmonised
#
# config_name is preserved as "p3a" for V1–V9 validation compatibility
# (expected_row_counts, overlap counts, identity thresholds all keyed on p3a).
#
# Authorization: docs/France_case/P3a/execution_logs/multi_year_stage_M1/JMP_stage_M1_P3a_GSURv2_stacking_authorization_v1.md
# Correction:    docs/archive/2026-05-26_round2_chain_compression/doc_only_corrections/JMP_stage_M1_P3a_GSURv2_stacking_authorization_correction_v1.md
#
# Usage:
#   python scripts/multi_year/<script>.py \
#       --stage-config config/multi_year/fr_p3a_gsurv2_stage_m1.yaml

# ---------------------------------------------------------------------------
# Project identity
# ---------------------------------------------------------------------------
country_code:   FR
country_slug:   fr
project_label:  JMP_multi_year
config_name:    p3a

# ---------------------------------------------------------------------------
# Year / tag mapping
# ---------------------------------------------------------------------------
years: [2015, 2016, 2017]
year_tags:
  2015: 1
  2016: 2
  2017: 3
  2018: 4

# ---------------------------------------------------------------------------
# UID scheme
# ---------------------------------------------------------------------------
uid_base: 100000000000   # B = 10**11

# ---------------------------------------------------------------------------
# Column names
# ---------------------------------------------------------------------------
household_id_col:      idhh
person_id_col:         idperson
raw_household_id_col:  idorighh
raw_person_id_col:     idorigperson
cluster_id_col:        cluster_id
cluster_source_col:    idorighh

# ---------------------------------------------------------------------------
# Raw identifier columns
# ---------------------------------------------------------------------------
raw_id_cols:
  - idorighh
  - idorigperson
  - idhh
  - idperson

# ---------------------------------------------------------------------------
# Monetary variables to deflate
# ---------------------------------------------------------------------------
monetary_variables:
  - ils_dispy
  - ils_earns
  - yem
  - yse
  - ypen
  - ypt
  - ils_ben

# ---------------------------------------------------------------------------
# Variables explicitly excluded from deflation
# ---------------------------------------------------------------------------
variables_excluded_from_deflation:
  - dgn
  - dag
  - dms
  - deh
  - drgn1
  - idhh
  - idperson
  - idorighh
  - idorigperson
  - dwt
  - gsur
  - year_tag
  - year
  - tpr
  - stacked_hh_uid
  - stacked_person_uid
  - cluster_id

# ---------------------------------------------------------------------------
# File paths (relative to repo root)
# ---------------------------------------------------------------------------
processed_root:   Data/processed/fr
pooled_output_dir: Data/processed/fr/pooled
results_dir:      Results
external_data_dir: Data/external

cpi_template_path: Data/external/cpi_hicp_fr_harmonisation_TEMPLATE.csv
cpi_final_path:    Data/external/cpi_hicp_fr_harmonisation.csv

input_parquet_dir: Data/processed/fr

# ---------------------------------------------------------------------------
# Input parquet glob patterns — EXACT GSURv2 STEMS ONLY
# Pattern matches fr_{year}_RURO_mnl_GSURv2_y*__*.parquet
# This will NOT match v1gsurY or v2gsurY stems.
# ---------------------------------------------------------------------------
input_parquet_patterns:
  - "*{year}*RURO*mnl*GSURv2*y*__*.parquet"

input_parquet_components: [singles, couples]

# ---------------------------------------------------------------------------
# Output file stems — GSURv2-specific (literal, not templated)
# ---------------------------------------------------------------------------
output_file_stems:
  stacked_raw:  "fr_p3a_gsurv2_stacked_raw"
  harmonised:   "fr_p3a_gsurv2_harmonised"

# ---------------------------------------------------------------------------
# Expected row / overlap counts (unchanged from provisional build)
# ---------------------------------------------------------------------------
expected_row_counts:
  p2:  22849
  p3a: 1244500
  p3b: 33725
  p4:  33334

expected_overlap_counts:
  "2015-2016": 0
  "2015-2017": 0
  "2015-2018": 0
  "2016-2017": 8796
  "2016-2018": 7065
  "2017-2018": 8521

p3a_overlap_tolerance: 200

ils_dispy_real_range:
  min: 25000.0
  max: 55000.0

# ---------------------------------------------------------------------------
# Identity validation thresholds (unchanged)
# ---------------------------------------------------------------------------
identity_validation_thresholds:
  sex_stability_min:    0.9990
  age_progression_min:  0.9950
  suspicious_warn_max:  0.0020
  suspicious_block_max: 0.0100
  hh_continuity_min:    0.9700

# ---------------------------------------------------------------------------
# Special gates (unchanged)
# ---------------------------------------------------------------------------
special_gates:
  p3b_isf_memo_path: Results/M1_ISF_tpr_comparability_check_2018.md
  p3b_isf_proceed_phrase: "proceed with p3b"

  blocked_configs:
    p3b: >
      P3b is blocked until Results/M1_ISF_tpr_comparability_check_2018.md
      concludes 'proceed'. See §16 of the Stage M1 plan.
    p4: >
      P4 is not a priority configuration. No authorisation in Stage M1.