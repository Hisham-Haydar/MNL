# ==============================================================================
# RURO MNL Estimation Specification - Ultra Minimal (Log-Only)
# ==============================================================================
# Maximum simplification:
# - Log utility only (no Box-Cox curvature parameters)
# - Pooled consumption (single beta_c for all groups)
# - Pooled leisure by gender only (beta_l0_m for males, beta_l0_f for females)
# - No preference shifters
# - Only 7 parameters total
# ==============================================================================

specification:
  name: "ultra_minimal_log"
  description: "Ultra-minimal spec: log utility, pooled consumption and leisure by gender (7 params total)"
  wage_spec: "vw"

# Utility Function (Preference Side)
utility:
  functional_form: "log"  # Log utility only - NO Box-Cox curvature

  consumption:
    coefficient: "beta_c"  # POOLED across all demographic groups
    box_cox_exponent: null

  leisure:
    intercept: "beta_l0"  # Will be split by gender: beta_l0_m, beta_l0_f
    box_cox_exponent: null
    shifters: []

# Hours Opportunity Density
hours_opportunity:
  shifters:
    - variable: "working"
      coefficient: "beta_work"
      description: "Working indicator (h>0)"

# Wage Opportunity Density
wage_opportunity:
  specification: "log_normal"

  mean_shifters:
    - variable: "intercept"
      coefficient: "beta_w0"
      description: "Log-wage intercept"

  variance:
    parameter: "sigma"
    description: "Standard deviation of log-wage residual"
    bounds: [0.1, 20.0]

# Singles/Couples sections
singles:
  gender_specific_leisure: true

couples:
  gender_specific_leisure: true
  leisure_interaction:
    coefficient: null

# Parameter Initialization (7 total parameters)
# ==============================================================================
# Parameters in this spec:
# 1. beta_c         - consumption utility (pooled across all)
# 2. beta_l0_m      - leisure intercept for males (single male + couple male)
# 3. beta_l0_f      - leisure intercept for females (single female + couple female)
# 4. beta_work      - hours opportunity (working indicator)
# 5. beta_w0        - wage intercept
# 6. sigma          - wage variance
# 7. (implied by demographics - no extra params)
# ==============================================================================
initial_values:
  # CONSUMPTION: Pooled across all groups
  beta_c: 1.1  # Average of: beta_c (1.2740), beta_c_sm (1.0399), beta_c_sf (0.7602)

  # LEISURE: Pooled by gender only
  beta_l0_m: 0.35  # Average for males: (0.4179 + 0.2886) / 2
  beta_l0_f: 1.01  # Average for females: (0.6778 + 1.3515) / 2

  # OPPORTUNITY & WAGE
  beta_work: 1.3950
  beta_w0: 2.1850
  sigma: 0.4723

# Optimization Settings
optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 10000
  tolerance: 1.0e-9
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

# No bounds needed (log utility, all params are free)
