# ==============================================================================
# RURO MNL Estimation Specification - Job Choice V0 Plus B (Stable + beta_cl)
# ==============================================================================
# Purpose:
# - Stable follow-up to v0_plus
# - Keep opportunity parsimonious (working + hours_bin + gsur)
# - Add Box-Cox consumption-leisure interaction beta_cl
# ==============================================================================

specification:
  name: "job_choice_v0_plus_b_stable_beta_cl"
  description: "Job-choice RURO: core preference shifters + parsimonious opportunity + beta_cl"
  wage_spec: "fw"

utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"
    box_cox_bounds: [-15.0, 0.95]

  consumption_leisure_interaction:
    coefficient: "beta_cl"
    description: "Box-Cox consumption-leisure interaction"

  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"
    box_cox_bounds: [-15.0, 0.95]
    shifters:
      - variable: "age_norm"
        coefficient: "beta_l_age_norm"
      - variable: "age_norm2"
        coefficient: "beta_l_age_norm2"
      - variable: "n_children"
        coefficient: "beta_l_n_children"
        gender_specific: true
      - variable: "educL"
        coefficient: "beta_l_educL"
      - variable: "educH"
        coefficient: "beta_l_educH"

hours_opportunity:
  shifters: []

wage_opportunity:
  specification: "log_normal"

market_opportunity:
  shifters:
    - variable: "working"
      coefficient: "beta_offer_working"
      applies_to: "both"
    - variable: "hours_bin"
      coefficient: "beta_offer_hours_bin"
      interaction: "working"
      applies_to: "both"
    - variable: "gsur"
      coefficient: "beta_offer_gsur"
      interaction: "working"
      applies_to: "both"

singles:
  gender_specific_leisure: true

couples: {}

initial_values:
  # Singles male
  beta_l0_sm: 0.40
  beta_l_age_norm_sm: -0.006
  beta_l_age_norm2_sm: -0.001
  beta_l_educL_sm: 0.15
  beta_l_educH_sm: -0.35
  beta_c_sm: 0.80
  beta_cl_sm: 0.00
  theta_l_sm: -0.20
  theta_c_sm: 0.20

  # Singles female
  beta_l0_sf: 0.60
  beta_l_age_norm_sf: -0.020
  beta_l_age_norm2_sf: -0.001
  beta_l_n_children_sf: 0.15
  beta_l_educL_sf: 0.15
  beta_l_educH_sf: -0.40
  beta_c_sf: 0.80
  beta_cl_sf: 0.00
  theta_l_sf: -0.20
  theta_c_sf: 0.20

  # Couples male leisure
  beta_l0_m: 0.30
  beta_l_age_norm_m: -0.003
  beta_l_age_norm2_m: -0.002
  beta_l_educL_m: 0.15
  beta_l_educH_m: -0.60
  beta_cl_m: 0.00
  theta_l_m: -0.20

  # Couples female leisure
  beta_l0_f: 0.90
  beta_l_age_norm_f: -0.025
  beta_l_age_norm2_f: -0.001
  beta_l_n_children_f: 0.10
  beta_l_educL_f: 0.15
  beta_l_educH_f: -0.25
  beta_cl_f: 0.00
  theta_l_f: -0.20

  # Couples household consumption
  beta_c: 0.90
  theta_c: 0.20

  # Market opportunity
  beta_offer_working: 0.50
  beta_offer_hours_bin: 0.00
  beta_offer_gsur: -0.10

optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 6000
  tolerance: 1.0e-8
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    # Box-Cox exponents
    theta_l_sm: [-20, 0.95]
    theta_c_sm: [-20, 0.95]
    theta_l_sf: [-20, 0.95]
    theta_c_sf: [-20, 0.95]
    theta_l_m: [-20, 0.95]
    theta_l_f: [-20, 0.95]
    theta_c: [-20, 0.95]

    # Consumption coefficients
    beta_c_sm: [0.01, 30.0]
    beta_c_sf: [0.01, 30.0]
    beta_c: [0.01, 30.0]

    # Leisure intercepts
    beta_l0_sm: [0.01, 50.0]
    beta_l0_sf: [0.01, 50.0]
    beta_l0_m: [0.01, 50.0]
    beta_l0_f: [0.01, 50.0]

    # Consumption-leisure interaction
    beta_cl_sm: [-13.0, 13.0]
    beta_cl_sf: [-13.0, 13.0]
    beta_cl_m: [-13.0, 13.0]
    beta_cl_f: [-13.0, 13.0]

    # Leisure shifters
    beta_l_age_norm_sm: [-15.0, 15.0]
    beta_l_age_norm2_sm: [-15.0, 15.0]
    beta_l_educL_sm: [-15.0, 15.0]
    beta_l_educH_sm: [-15.0, 15.0]

    beta_l_age_norm_sf: [-15.0, 15.0]
    beta_l_age_norm2_sf: [-15.0, 15.0]
    beta_l_n_children_sf: [-15.0, 15.0]
    beta_l_educL_sf: [-15.0, 15.0]
    beta_l_educH_sf: [-15.0, 15.0]

    beta_l_age_norm_m: [-15.0, 15.0]
    beta_l_age_norm2_m: [-15.0, 15.0]
    beta_l_educL_m: [-15.0, 15.0]
    beta_l_educH_m: [-15.0, 15.0]

    beta_l_age_norm_f: [-15.0, 15.0]
    beta_l_age_norm2_f: [-15.0, 15.0]
    beta_l_n_children_f: [-15.0, 15.0]
    beta_l_educL_f: [-15.0, 15.0]
    beta_l_educH_f: [-15.0, 15.0]

    # Market opportunity
    beta_offer_working: [-30.0, 30.0]
    beta_offer_hours_bin: [-20.0, 20.0]
    beta_offer_gsur: [-50.0, 50.0]

  expression_constraints:
    enabled: true
    default_mode: soft
    default_weight: 1000.0
    constraints:
      # Singles male
      - name: muc_sm_positive
        expression: muc
        group: singles_male
        at: {consumption: 1.0, leisure: 1.0, age_norm: 0.0, age_norm2: 0.0, educL: 0.0, educH: 0.0}
        lower: 1.0e-6
      - name: muc_sm_decreasing
        expression: dmuc_dc
        group: singles_male
        at: {consumption: 1.0, leisure: 1.0, age_norm: 0.0, age_norm2: 0.0, educL: 0.0, educH: 0.0}
        upper: -1.0e-6
      - name: mul_sm_positive
        expression: mul
        group: singles_male
        at: {consumption: 1.0, leisure: 1.0, age_norm: 0.0, age_norm2: 0.0, educL: 0.0, educH: 0.0}
        lower: 1.0e-6
      - name: mul_sm_decreasing
        expression: dmul_dl
        group: singles_male
        at: {consumption: 1.0, leisure: 1.0, age_norm: 0.0, age_norm2: 0.0, educL: 0.0, educH: 0.0}
        upper: -1.0e-6

      # Singles female
      - name: muc_sf_positive
        expression: muc
        group: singles_female
        at: {consumption: 1.0, leisure: 1.0, age_norm: 0.0, age_norm2: 0.0, n_children: 1.0, educL: 0.0, educH: 0.0}
        lower: 1.0e-6
      - name: muc_sf_decreasing
        expression: dmuc_dc
        group: singles_female
        at: {consumption: 1.0, leisure: 1.0, age_norm: 0.0, age_norm2: 0.0, n_children: 1.0, educL: 0.0, educH: 0.0}
        upper: -1.0e-6
      - name: mul_sf_positive
        expression: mul
        group: singles_female
        at: {consumption: 1.0, leisure: 1.0, age_norm: 0.0, age_norm2: 0.0, n_children: 1.0, educL: 0.0, educH: 0.0}
        lower: 1.0e-6
      - name: mul_sf_decreasing
        expression: dmul_dl
        group: singles_female
        at: {consumption: 1.0, leisure: 1.0, age_norm: 0.0, age_norm2: 0.0, n_children: 1.0, educL: 0.0, educH: 0.0}
        upper: -1.0e-6

      # Couples household MUC
      - name: muc_cou_positive
        expression: muc
        group: couples_household
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6
      - name: muc_cou_decreasing
        expression: dmuc_dc
        group: couples_household
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        upper: -1.0e-6

      # Couples male MUL
      - name: mul_cou_m_positive
        expression: mul
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0, age_norm: 0.0, age_norm2: 0.0, educL: 0.0, educH: 0.0}
        lower: 1.0e-6
      - name: mul_cou_m_decreasing
        expression: dmul_dl
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0, age_norm: 0.0, age_norm2: 0.0, educL: 0.0, educH: 0.0}
        upper: -1.0e-6

      # Couples female MUL
      - name: mul_cou_f_positive
        expression: mul
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0, n_children: 1.0, age_norm: 0.0, age_norm2: 0.0, educL: 0.0, educH: 0.0}
        lower: 1.0e-6
      - name: mul_cou_f_decreasing
        expression: dmul_dl
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0, n_children: 1.0, age_norm: 0.0, age_norm2: 0.0, educL: 0.0, educH: 0.0}
        upper: -1.0e-6

gradient_verification:
  enabled: false
  method: "central"
  epsilon: 1.0e-7
  tolerance: 1.0e-4
  check_at_init: true
  check_random_points: 0
  random_seed: 13
  verbose: true
