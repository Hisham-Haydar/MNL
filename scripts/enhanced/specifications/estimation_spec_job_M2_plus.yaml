    - variable: "age_norm"
      coefficient: "beta_offer_age_isco1_6"
      interaction: ["working", "isco1_6"]
    - variable: "age_norm"
      coefficient: "beta_offer_age_isco1_7"
      interaction: ["working", "isco1_7"]
    - variable: "age_norm"
      coefficient: "beta_offer_age_isco1_8"
      interaction: ["working", "isco1_8"]
    - variable: "age_norm"
      coefficient: "beta_offer_age_isco1_9"
      interaction: ["working", "isco1_9"]

    # M2+ additions: region × isco1 (household-level region dummies)
    - variable: "reg2"
      applies_to: "household"
      coefficient: "beta_offer_reg2_isco1_1"
      interaction: ["working", "isco1_1"]
