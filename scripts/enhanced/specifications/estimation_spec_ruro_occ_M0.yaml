# ==============================================================================
# RURO MNL Estimation Specification - RURO occupation-opportunity M0
# ==============================================================================
# Continuous RURO baseline with one additive
# OCCUPATION-opportunity layer using EUROMOD `loc` collapsed to `loc4`.
#
# Reference docs:
#   docs/specifications/RURO_occ_pipeline_audit_v1.md
#   docs/package/RURO_NAMING_AND_PACKAGE_SCOPE_v1.md
#   Historical development docs are listed in the implementation report.
#
# Choice index (per individual; partner-additive for couples):
#   V = U  +  O^E + O^H  +  O^W  +  O^Occ  -  log_prior
#
# Where:
#   U       Box-Cox utility in normalized consumption C and leisure L
#   O^E+O^H working intercept + PT1/PT2/FT focal points + gsur + educH shifter
#   O^W     log-normal wage (Mincer mean, shared sigma)
#   O^Occ   sum_{k in {2,3,4}} beta_occ_k * 1{loc4=k} * working
#   log_prior  =  log_q_E + working * (log_q_H + log_q_W + log_q_Occ)
#
# Reference occupation category at M0 is loc4 = 1 (routine-manual).
# `loc4` is NOT in utility. `loc4` is NOT in O^E/O^H/O^W. Hard restriction.
#
# IMPLEMENTATION NOTE:
#   The dedicated `occupation_opportunity` block is parsed in
#   estimation_spec_parser.py and (i) enforces the contract section 20
#   exclusion restriction: loc4/loc may not appear in utility,
#   hours_opportunity, wage_opportunity, or market_opportunity; and (ii)
#   internally appends its
#   shifters to market_opportunity_shifters so the existing engine path
#   evaluates them with the `working` gate. The math is identical to a
#   first-class O^Occ block.
#
# IDENTIFICATION PRECONDITION (must be true in the MNL parquet):
#   Within every household, `loc4` (and `loc4_male`/`loc4_female`) must vary
#   ACROSS WORKING ALTERNATIVES, i.e. drawn from q_Occ at draw time, not
#   carried as a fixed decider attribute. The current production MNL files
#   (built with the default `--occ-spec fixed` in `enh_RURO_draws.py`) DO NOT
#   satisfy this: all working alts of a household share the observed `loc4`,
#   making beta_occ_k collinear with beta_E. Run with
#   `--occ-spec empirical` first; see the implementation report.
# ==============================================================================

specification:
  name: "ruro_occ_M0"
  description: "Continuous RURO baseline with additive occupation opportunity (loc4, ref=1)"
  wage_spec: "vw"
  model_family: "regular"

utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"
    box_cox_bounds: [-8.0, 0.95]

  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"
    box_cox_bounds: [-8.0, 0.95]
    shifters:
      - variable: "age_norm"
        coefficient: "beta_l_age"
      - variable: "age_norm2"
        coefficient: "beta_l_age2"
      - variable: "n_children"
        coefficient: "beta_l_nkids"
        gender_specific: true   # female only
      - variable: "educH"
        coefficient: "beta_l_educH"

hours_opportunity:
  # O^E + O^H. Base employment intercept β_E · working is the participation
  # log-odds (contract §9, frozen spec §7). PT1/PT2/FT focal-point shifters.
  shifters:
    - variable: "working"
      coefficient: "beta_E"
    - variable: "working_pt1"
      coefficient: "beta_h_pt1"
    - variable: "working_pt2"
      coefficient: "beta_h_pt2"
    - variable: "working_ft"
      coefficient: "beta_h_ft"

wage_opportunity:
  # Log-normal wage opportunity with Mincer mean (frozen spec §8 / contract §10).
  # μ(X) = β_w0 + β_w_educL·educL + β_w_educH·educH + β_w_pexp·pexp + β_w_pexp2·pexp²
  # σ shared across occupations at M0.
  specification: "log_normal"
  mean_shifters:
    - variable: "intercept"
      coefficient: "beta_w0"
    - variable: "educL"
      coefficient: "beta_w_educL"
    - variable: "educH"
      coefficient: "beta_w_educH"
    - variable: "pexp_years"
      coefficient: "beta_w_pexp"
    - variable: "pexp_years2"
      coefficient: "beta_w_pexp2"
  variance:
    parameter: "sigma"

market_opportunity:
  # Residual employment/market access shifters only.
  # Occupation lives in its own block below.
  applies_to: "both"
  employment_indicator: "working"
  gsur_variable: "gsur"
  offer_only_vars: ["gsur"]
  center_within_choice_set: true
  center_weights: "proposal"
  variable_scales:
    gsur: 10.0

  shifters:
    - variable: "gsur"
      coefficient: "beta_E_gsur"
      interaction: ["working"]
    - variable: "educH"
      coefficient: "beta_E_educH"
      interaction: ["working"]

occupation_opportunity:
  # O^Occ — dedicated block parsed in estimation_spec_parser.py.
  # Variable locked to loc4 at M0; reference category loc4 = 1 (routine-manual).
  # Parser enforces: loc4/loc may NOT appear in utility, hours_opportunity,
  # wage_opportunity, or market_opportunity.
  variable: "loc4"
  reference: 1
  shifters:
    - variable: "loc4_2"
      coefficient: "beta_occ_2_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_cf"
      applies_to: "cf"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_cf"
      applies_to: "cf"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_cf"
      applies_to: "cf"
      interaction: ["working"]

couples: {}

initial_values:
  # Preferences — neutral starts (no warm-start from job-choice runs, which
  # use a different model family).
  beta_l0_sm: 1.0
  beta_l_age_sm: 0.0
  beta_l_age2_sm: 0.0
  beta_l_educH_sm: 0.0
  beta_c_sm: 1.0
  theta_l_sm: -1.0
  theta_c_sm: -1.0

  beta_l0_sf: 1.0
  beta_l_age_sf: 0.0
  beta_l_age2_sf: 0.0
  beta_l_nkids_sf: 0.0
  beta_l_educH_sf: 0.0
  beta_c_sf: 1.0
  theta_l_sf: -1.0
  theta_c_sf: -1.0

  beta_l0_m: 1.0
  beta_l_age_m: 0.0
  beta_l_age2_m: 0.0
  beta_l_educH_m: 0.0
  theta_l_m: -1.0

  beta_l0_f: 1.0
  beta_l_age_f: 0.0
  beta_l_age2_f: 0.0
  beta_l_nkids_f: 0.0
  beta_l_educH_f: 0.0
  theta_l_f: -1.0

  beta_c: 1.0
  theta_c: -1.0

  # Employment intercept and hours focal-point shifters
  beta_E:     0.0
  beta_h_pt1: 0.0
  beta_h_pt2: 0.0
  beta_h_ft:  0.0

  # Market opportunity (residual): gsur and educH on working
  beta_E_gsur:  0.0
  beta_E_educH: 0.0

  # Wage opportunity Mincer mean (β_w0 + β_w_educL·educL + β_w_educH·educH
  #                              + β_w_pexp·pexp + β_w_pexp2·pexp²)
  beta_w0:       2.0
  beta_w_educL: -0.1
  beta_w_educH:  0.2
  beta_w_pexp:   0.02
  beta_w_pexp2: -0.0003

  # Occupation opportunity (reference loc4=1; routine-manual)
  beta_occ_2_sm: 0.0
  beta_occ_3_sm: 0.0
  beta_occ_4_sm: 0.0
  beta_occ_2_sf: 0.0
  beta_occ_3_sf: 0.0
  beta_occ_4_sf: 0.0
  beta_occ_2_cm: 0.0
  beta_occ_3_cm: 0.0
  beta_occ_4_cm: 0.0
  beta_occ_2_cf: 0.0
  beta_occ_3_cf: 0.0
  beta_occ_4_cf: 0.0

  # Wage opportunity (log-normal noise; Mincer mean handled by wage block)
  sigma: 0.5

optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 6000
  tolerance: 1.0e-8
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    # Box-Cox exponents — NONE hard-fixed at M0 (contract §19)
    theta_l_sm: [-8.0, 0.95]
    theta_c_sm: [-8.0, 0.95]
    theta_l_sf: [-8.0, 0.95]
    theta_c_sf: [-8.0, 0.95]
    theta_l_m:  [-8.0, 0.95]
    theta_l_f:  [-8.0, 0.95]
    theta_c:    [-8.0, 0.95]

    # Preference scales
    beta_c_sm: [0.05, 50.0]
    beta_c_sf: [0.05, 50.0]
    beta_c:    [0.05, 50.0]
    beta_l0_sm: [0.05, 50.0]
    beta_l0_sf: [0.05, 50.0]
    beta_l0_m:  [0.05, 50.0]
    beta_l0_f:  [0.05, 50.0]

    # Leisure shifters
    beta_l_age_sm:   [-5.0, 5.0]
    beta_l_age2_sm:  [-1.0, 1.0]
    beta_l_age_sf:   [-5.0, 5.0]
    beta_l_age2_sf:  [-1.0, 1.0]
    beta_l_age_m:    [-5.0, 5.0]
    beta_l_age2_m:   [-1.0, 1.0]
    beta_l_age_f:    [-5.0, 5.0]
    beta_l_age2_f:   [-1.0, 1.0]
    beta_l_nkids_sf: [-5.0, 5.0]
    beta_l_nkids_f:  [-5.0, 5.0]
    beta_l_educH_sm: [-8.0, 5.0]
    beta_l_educH_sf: [-8.0, 5.0]
    beta_l_educH_m:  [-8.0, 5.0]
    beta_l_educH_f:  [-8.0, 5.0]

    # Employment intercept and hours focal-point shifters
    beta_E:     [-25.0, 25.0]
    beta_h_pt1: [-10.0, 10.0]
    beta_h_pt2: [-10.0, 10.0]
    beta_h_ft:  [-10.0, 10.0]

    # Wage opportunity Mincer mean
    beta_w0:       [-10.0, 20.0]
    beta_w_educL:  [-5.0, 5.0]
    beta_w_educH:  [-5.0, 5.0]
    beta_w_pexp:   [-1.0, 1.0]
    beta_w_pexp2:  [-0.1, 0.1]

    # Market opportunity residual
    beta_E_gsur:  [-10.0, 10.0]
    beta_E_educH: [-10.0, 10.0]

    # Occupation opportunity (reference loc4=1)
    beta_occ_2_sm: [-10.0, 10.0]
    beta_occ_3_sm: [-10.0, 10.0]
    beta_occ_4_sm: [-10.0, 10.0]
    beta_occ_2_sf: [-10.0, 10.0]
    beta_occ_3_sf: [-10.0, 10.0]
    beta_occ_4_sf: [-10.0, 10.0]
    beta_occ_2_cm: [-10.0, 10.0]
    beta_occ_3_cm: [-10.0, 10.0]
    beta_occ_4_cm: [-10.0, 10.0]
    beta_occ_2_cf: [-10.0, 10.0]
    beta_occ_3_cf: [-10.0, 10.0]
    beta_occ_4_cf: [-10.0, 10.0]

    # Wage noise
    sigma: [0.1, 20.0]

  expression_constraints:
    enabled: true
    default_mode: soft
    default_weight: 1000.0
    constraints:
      - name: mul_cou_m_positive
        expression: mul
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6
      - name: mul_cou_f_positive
        expression: mul
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6

gradient_verification:
  enabled: false
