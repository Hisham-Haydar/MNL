# ==============================================================================
# RURO MNL Estimation Specification - Job Choice V0 Plus C
# ==============================================================================
# Purpose:
# - Move age/education from preference shifters to opportunity shifters
# - Keep Box-Cox utility + beta_cl in preferences
# - Add parsimonious opportunity controls for age/education/experience/region
# - Keep soft expression constraints on MUC/MUL
# ==============================================================================

specification:
  name: "job_choice_v0_plus_c_opportunity_shifted"
  description: "Job-choice RURO: Box-Cox + beta_cl, demographics mainly in market opportunity"
  wage_spec: "fw"

utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"
    box_cox_bounds: [-15.0, 0.95]

  consumption_leisure_interaction:
    coefficient: "beta_cl"
    description: "Box-Cox consumption-leisure interaction"

  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"
    box_cox_bounds: [-15.0, 0.95]
    shifters:
      - variable: "n_children"
        coefficient: "beta_l_n_children"
        gender_specific: true

hours_opportunity:
  shifters: []

wage_opportunity:
  specification: "log_normal"

market_opportunity:
  shifters:
    - variable: "working"
      coefficient: "beta_offer_working"
      applies_to: "both"
    - variable: "hours_bin"
      coefficient: "beta_offer_hours_bin"
      interaction: "working"
      applies_to: "both"
    - variable: "wage_bin"
      coefficient: "beta_offer_wage_bin"
      interaction: "working"
      applies_to: "both"
    - variable: "isco1"
      coefficient: "beta_offer_isco1"
      interaction: "working"
      applies_to: "both"
    - variable: "gsur"
      coefficient: "beta_offer_gsur"
      interaction: "working"
      applies_to: "both"
    - variable: "educL"
      coefficient: "beta_offer_educL"
      interaction: "working"
      applies_to: "both"
    - variable: "educH"
      coefficient: "beta_offer_educH"
      interaction: "working"
      applies_to: "both"
    - variable: "age_norm"
      coefficient: "beta_offer_age_norm"
      interaction: "working"
      applies_to: "both"
    - variable: "age_norm2"
      coefficient: "beta_offer_age_norm2"
      interaction: "working"
      applies_to: "both"
    - variable: "pexp_years"
      coefficient: "beta_offer_pexp"
      interaction: "working"
      applies_to: "both"
    - variable: "pexp_years2"
      coefficient: "beta_offer_pexp2"
      interaction: "working"
      applies_to: "both"
    - variable: "reg2"
      coefficient: "beta_offer_reg2"
      applies_to: "household"
    - variable: "reg3"
      coefficient: "beta_offer_reg3"
      applies_to: "household"
    - variable: "reg4"
      coefficient: "beta_offer_reg4"
      applies_to: "household"
    - variable: "reg5"
      coefficient: "beta_offer_reg5"
      applies_to: "household"
    - variable: "reg6"
      coefficient: "beta_offer_reg6"
      applies_to: "household"
    - variable: "reg7"
      coefficient: "beta_offer_reg7"
      applies_to: "household"
    - variable: "reg8"
      coefficient: "beta_offer_reg8"
      applies_to: "household"

singles:
  gender_specific_leisure: true

couples: {}

initial_values:
  # Singles male
  beta_l0_sm: 0.40
  beta_c_sm: 0.80
  beta_cl_sm: 0.00
  theta_l_sm: -0.20
  theta_c_sm: 0.20

  # Singles female
  beta_l0_sf: 0.60
  beta_l_n_children_sf: 0.15
  beta_c_sf: 0.80
  beta_cl_sf: 0.00
  theta_l_sf: -0.20
  theta_c_sf: 0.20

  # Couples male leisure
  beta_l0_m: 0.30
  beta_cl_m: 0.00
  theta_l_m: -0.20

  # Couples female leisure
  beta_l0_f: 0.90
  beta_l_n_children_f: 0.10
  beta_cl_f: 0.00
  theta_l_f: -0.20

  # Couples household consumption
  beta_c: 0.90
  theta_c: 0.20

  # Market opportunity
  beta_offer_working: 0.50
  beta_offer_hours_bin: 0.00
  beta_offer_wage_bin: 0.00
  beta_offer_isco1: 0.00
  beta_offer_gsur: -0.10
  beta_offer_educL: 0.00
  beta_offer_educH: 0.00
  beta_offer_age_norm: 0.00
  beta_offer_age_norm2: 0.00
  beta_offer_pexp: 0.00
  beta_offer_pexp2: 0.00
  beta_offer_reg2: 0.00
  beta_offer_reg3: 0.00
  beta_offer_reg4: 0.00
  beta_offer_reg5: 0.00
  beta_offer_reg6: 0.00
  beta_offer_reg7: 0.00
  beta_offer_reg8: 0.00

optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 6000
  tolerance: 1.0e-8
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    # Box-Cox exponents
    theta_l_sm: [-20.0, 0.95]
    theta_c_sm: [-20.0, 0.95]
    theta_l_sf: [-20.0, 0.95]
    theta_c_sf: [-20.0, 0.95]
    theta_l_m: [-20.0, 0.95]
    theta_l_f: [-20.0, 0.95]
    theta_c: [-20.0, 0.95]

    # Consumption coefficients
    beta_c_sm: [0.01, 30.0]
    beta_c_sf: [0.01, 30.0]
    beta_c: [0.01, 30.0]

    # Leisure intercepts and children shifters
    beta_l0_sm: [0.01, 50.0]
    beta_l0_sf: [0.01, 50.0]
    beta_l0_m: [0.01, 50.0]
    beta_l0_f: [0.01, 50.0]
    beta_l_n_children_sf: [-15.0, 15.0]
    beta_l_n_children_f: [-15.0, 15.0]

    # Consumption-leisure interaction
    beta_cl_sm: [-13.0, 13.0]
    beta_cl_sf: [-13.0, 13.0]
    beta_cl_m: [-13.0, 13.0]
    beta_cl_f: [-13.0, 13.0]

    # Market opportunity
    beta_offer_working: [-30.0, 30.0]
    beta_offer_hours_bin: [-20.0, 20.0]
    beta_offer_wage_bin: [-20.0, 20.0]
    beta_offer_isco1: [-20.0, 20.0]
    beta_offer_gsur: [-50.0, 50.0]
    beta_offer_educL: [-20.0, 20.0]
    beta_offer_educH: [-20.0, 20.0]
    beta_offer_age_norm: [-20.0, 20.0]
    beta_offer_age_norm2: [-20.0, 20.0]
    beta_offer_pexp: [-20.0, 20.0]
    beta_offer_pexp2: [-20.0, 20.0]
    beta_offer_reg2: [-20.0, 20.0]
    beta_offer_reg3: [-20.0, 20.0]
    beta_offer_reg4: [-20.0, 20.0]
    beta_offer_reg5: [-20.0, 20.0]
    beta_offer_reg6: [-20.0, 20.0]
    beta_offer_reg7: [-20.0, 20.0]
    beta_offer_reg8: [-20.0, 20.0]

  expression_constraints:
    enabled: true
    default_mode: soft
    default_weight: 1000.0
    constraints:
      # Singles male
      - name: muc_sm_positive
        expression: muc
        group: singles_male
        at: {consumption: 1.0, leisure: 1.0}
        lower: 1.0e-6
      - name: muc_sm_decreasing
        expression: dmuc_dc
        group: singles_male
        at: {consumption: 1.0, leisure: 1.0}
        upper: -1.0e-6
      - name: mul_sm_positive
        expression: mul
        group: singles_male
        at: {consumption: 1.0, leisure: 1.0}
        lower: 1.0e-6
      - name: mul_sm_decreasing
        expression: dmul_dl
        group: singles_male
        at: {consumption: 1.0, leisure: 1.0}
        upper: -1.0e-6

      # Singles female
      - name: muc_sf_positive
        expression: muc
        group: singles_female
        at: {consumption: 1.0, leisure: 1.0, n_children: 1.0}
        lower: 1.0e-6
      - name: muc_sf_decreasing
        expression: dmuc_dc
        group: singles_female
        at: {consumption: 1.0, leisure: 1.0, n_children: 1.0}
        upper: -1.0e-6
      - name: mul_sf_positive
        expression: mul
        group: singles_female
        at: {consumption: 1.0, leisure: 1.0, n_children: 1.0}
        lower: 1.0e-6
      - name: mul_sf_decreasing
        expression: dmul_dl
        group: singles_female
        at: {consumption: 1.0, leisure: 1.0, n_children: 1.0}
        upper: -1.0e-6

      # Couples household MUC
      - name: muc_cou_positive
        expression: muc
        group: couples_household
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6
      - name: muc_cou_decreasing
        expression: dmuc_dc
        group: couples_household
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        upper: -1.0e-6

      # Couples male MUL
      - name: mul_cou_m_positive
        expression: mul
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6
      - name: mul_cou_m_decreasing
        expression: dmul_dl
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        upper: -1.0e-6

      # Couples female MUL
      - name: mul_cou_f_positive
        expression: mul
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0, n_children: 1.0}
        lower: 1.0e-6
      - name: mul_cou_f_decreasing
        expression: dmul_dl
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0, n_children: 1.0}
        upper: -1.0e-6

gradient_verification:
  enabled: false
  method: "central"
  epsilon: 1.0e-7
  tolerance: 1.0e-4
  check_at_init: true
  check_random_points: 0
  random_seed: 13
  verbose: true
