# ==============================================================================
# RURO MNL Estimation Specification - Ultra Minimal
# ==============================================================================
# MAXIMUM SIMPLIFICATION: Pool BOTH consumption and leisure by gender
# via equal initialization across group types.
# Leisure: 4 params (_sm=_m, _sf=_f) + 4 thetas
# Consumption: 3 params (all set equal) - fully pooled
# NOTE: Parser creates 14 parameters but with full pooling constraint
# ==============================================================================

specification:
  name: "ultra_minimal_log"
  description: "Maximum pooling via equal initialization: leisure (4 params with _sm=_m, _sf=_f), consumption (3 params all equal), wage. 14 params with constraints"
  wage_spec: "vw"

# Utility Function (Preference Side)
utility:
  functional_form: "box_cox"  # Box-Cox form

  consumption:
    coefficient: "beta_c"  # POOLED: single param for ALL groups
    box_cox_exponent: null  # No theta for consumption (log utility)

  leisure:
    intercept: "beta_l0"  # By gender only (not by single/couple)
    box_cox_exponent: null  # No theta for leisure (log utility)
    shifters: []

# Hours Opportunity Density
hours_opportunity:
  shifters:
    - variable: "working"
      coefficient: "beta_work"
      description: "Working indicator (h>0)"

# Wage Opportunity Density
wage_opportunity:
  specification: "log_normal"

  mean_shifters:
    - variable: "intercept"
      coefficient: "beta_w0"
      description: "Log-wage intercept"

  variance:
    parameter: "sigma"
    description: "Standard deviation of log-wage residual"
    bounds: [0.1, 20.0]

# Singles/Couples sections - Pool leisure by gender ONLY
singles:
  gender_specific_leisure: true

couples:
  gender_specific_leisure: true
  leisure_interaction:
    coefficient: null

# Parameter Initialization
# TRULY MINIMAL: 1 consumption param, 2 leisure params, 0 thetas, 3 opportunity params
# Note: Parser always creates _sm, _sf, _m, _f but we pool by setting equal values
initial_values:
  # LEISURE: By gender only
  # Parser creates _sm, _sf, _m, _f; set singles=couples to pool by gender
  beta_l0_sm: 0.35   # Singles male (pooled with couples male)
  beta_l0_sf: 1.01   # Singles female (pooled with couples female)
  beta_l0_m: 0.35    # Couples male
  beta_l0_f: 1.01    # Couples female

  # CONSUMPTION: Single param for everyone
  # Parser creates _sm, _sf, base; set all equal for true pooling
  beta_c_sm: 1.1     # Singles male (pooled)
  beta_c_sf: 1.1     # Singles female (pooled)
  beta_c: 1.1        # Couples (pooled)

  # OPPORTUNITY & WAGE
  beta_work: 1.3950
  beta_w0: 2.1850
  sigma: 0.4723

# Optimization Settings
optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 10000
  tolerance: 1.0e-9
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  # Bounds: only sigma (no thetas in this spec)
  bounds:
    sigma: [0.1, 20.0]
