# ==============================================================================
# RURO MNL Estimation Specification - Job Choice M2g (Unified Opportunity)
# ==============================================================================
# Goal:
#   Keep the strong M2f/M2e_a market block, but move focal-hours terms from
#   hours_opportunity into market_opportunity so they are centered within each
#   choice set and estimated in the same opportunity index.
#
# Key design:
#   - hours_opportunity: empty
#   - market_opportunity:
#       * occupation intercepts (isco1_2..9 x working)
#       * type intercept (type_id_2 x working)
#       * gsur base + type slopes + educM slope
#       * focal-hours terms in market index (gender-specific):
#           working_pt1, working_pt2, working_ft
#
# Rationale:
#   - M2e_hours showed pt1/pt2 collapsing to bounds in a separate hours equation.
#   - Putting focal-hours in market_opportunity applies the same centering and
#     often improves numerical behavior.
# ==============================================================================

specification:
  name: "job_choice_M2g_unified_opportunity"
  description: "Job-choice M2g: unified market opportunity with focal-hours terms"
  wage_spec: "fw"
  model_family: "job_choice"

utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"
    box_cox_bounds: [-8.0, 0.95]

  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"
    box_cox_bounds: [-8.0, 0.95]
    shifters:
      - variable: "age_norm"
        coefficient: "beta_l_age"
      - variable: "age_norm2"
        coefficient: "beta_l_age2"
      - variable: "n_children"
        coefficient: "beta_l_nkids"
        gender_specific: true
      - variable: "educH"
        coefficient: "beta_l_educH"

hours_opportunity:
  shifters: []

wage_opportunity:
  specification: "log_normal"

market_opportunity:
  applies_to: "both"
  employment_indicator: "working"
  gsur_variable: "gsur"
  offer_only_vars: ["gsur", "drgn1", "reg_nuts1_1", "reg_nuts1_2", "reg_nuts1_3", "reg_nuts1_4", "reg_nuts1_5", "reg_nuts1_6", "reg_nuts1_7", "reg_nuts1_8"]
  center_within_choice_set: true
  center_weights: "proposal"
  enforce_job_varying: true
  variable_scales:
    gsur: 10.0

  shifters:
    # Occupation-level access shifts (isco1=1 reference)
    - variable: "isco1_2"
      coefficient: "beta_offer_isco1_2"
      interaction: ["working"]
    - variable: "isco1_3"
      coefficient: "beta_offer_isco1_3"
      interaction: ["working"]
    - variable: "isco1_4"
      coefficient: "beta_offer_isco1_4"
      interaction: ["working"]
    - variable: "isco1_5"
      coefficient: "beta_offer_isco1_5"
      interaction: ["working"]
    - variable: "isco1_6"
      coefficient: "beta_offer_isco1_6"
      interaction: ["working"]
    - variable: "isco1_7"
      coefficient: "beta_offer_isco1_7"
      interaction: ["working"]
    - variable: "isco1_8"
      coefficient: "beta_offer_isco1_8"
      interaction: ["working"]
    - variable: "isco1_9"
      coefficient: "beta_offer_isco1_9"
      interaction: ["working"]

    # Type-level access shift (type_id=0 reference; type_1 intercept omitted)
    - variable: "type_id_2"
      coefficient: "beta_offer_type_2"
      interaction: ["working"]

    # Base gsur slope + type/education heterogeneity
    - variable: "gsur"
      coefficient: "beta_offer_gsur_base"
      interaction: ["working"]
    - variable: "gsur"
      coefficient: "beta_offer_gsur_type_1"
      interaction: ["working", "type_id_1"]
    - variable: "gsur"
      coefficient: "beta_offer_gsur_type_2"
      interaction: ["working", "type_id_2"]
    - variable: "gsur"
      coefficient: "beta_offer_gsur_educM"
      interaction: ["working", "educM"]

    # Focal-hours terms in market opportunity (gender-specific coefficients)
    - variable: "working_pt1"
      coefficient: "beta_offer_h_pt1_m"
      interaction: ["working"]
      applies_to: "male"
    - variable: "working_pt2"
      coefficient: "beta_offer_h_pt2_m"
      interaction: ["working"]
      applies_to: "male"
    - variable: "working_ft"
      coefficient: "beta_offer_h_ft_m"
      interaction: ["working"]
      applies_to: "male"
    - variable: "working_pt1"
      coefficient: "beta_offer_h_pt1_f"
      interaction: ["working"]
      applies_to: "female"
    - variable: "working_pt2"
      coefficient: "beta_offer_h_pt2_f"
      interaction: ["working"]
      applies_to: "female"
    - variable: "working_ft"
      coefficient: "beta_offer_h_ft_f"
      interaction: ["working"]
      applies_to: "female"

couples: {}

initial_values:
  # Preference block (M2f-based warm start)
  beta_l0_sm: 5.020
  beta_l_age_sm: 0.100
  beta_l_age2_sm: 0.005
  beta_l_educH_sm: -1.485
  beta_c_sm: 0.838
  theta_l_sm: -2.722
  theta_c_sm: -1.525496

  beta_l0_sf: 8.338
  beta_l_age_sf: -0.017
  beta_l_age2_sf: 0.003
  beta_l_nkids_sf: -0.299
  beta_l_educH_sf: -4.618
  beta_c_sf: 0.823
  theta_l_sf: -2.190
  theta_c_sf: -1.494

  beta_l0_m: 3.913
  beta_l_age_m: -0.038
  beta_l_age2_m: 0.003
  beta_l_educH_m: -2.091
  theta_l_m: -2.203

  beta_l0_f: 6.949
  beta_l_age_f: -0.055
  beta_l_age2_f: 0.000
  beta_l_nkids_f: -0.206
  beta_l_educH_f: -3.240
  theta_l_f: -1.909

  beta_c: 1.180
  theta_c: -2.681

  # Market opportunity (M2f-based)
  beta_offer_isco1_2: 0.832
  beta_offer_isco1_3: 0.654
  beta_offer_isco1_4: 0.269
  beta_offer_isco1_5: 0.483
  beta_offer_isco1_6: -1.163
  beta_offer_isco1_7: 0.546
  beta_offer_isco1_8: -0.029
  beta_offer_isco1_9: -0.178
  beta_offer_type_2: 0.275
  beta_offer_gsur_base: -1.084
  beta_offer_gsur_type_1: -0.360
  beta_offer_gsur_type_2: -0.465
  beta_offer_gsur_educM: 0.274

  # New focal-hours opportunity terms (start small)
  beta_offer_h_pt1_m: 0.10
  beta_offer_h_pt2_m: 0.10
  beta_offer_h_ft_m: 0.10
  beta_offer_h_pt1_f: 0.10
  beta_offer_h_pt2_f: 0.10
  beta_offer_h_ft_f: 0.10

optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 6000
  tolerance: 1.0e-8
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    # Box-Cox exponents
    theta_l_sm: [-8.0, 0.95]
    theta_c_sm: [-1.525496001, -1.525495999]
    theta_l_sf: [-8.0, 0.95]
    theta_c_sf: [-8.0, 0.95]
    theta_l_m: [-8.0, 0.95]
    theta_l_f: [-8.0, 0.95]
    theta_c: [-8.0, 0.95]

    # Preference scales
    beta_c_sm: [0.05, 50.0]
    beta_c_sf: [0.05, 50.0]
    beta_c: [0.05, 50.0]
    beta_l0_sm: [0.05, 50.0]
    beta_l0_sf: [0.05, 50.0]
    beta_l0_m: [0.05, 50.0]
    beta_l0_f: [0.05, 50.0]

    # Leisure shifters
    beta_l_age_sm: [-5.0, 5.0]
    beta_l_age2_sm: [-1.0, 1.0]
    beta_l_age_sf: [-5.0, 5.0]
    beta_l_age2_sf: [-1.0, 1.0]
    beta_l_age_m: [-5.0, 5.0]
    beta_l_age2_m: [-1.0, 1.0]
    beta_l_age_f: [-5.0, 5.0]
    beta_l_age2_f: [-1.0, 1.0]
    beta_l_nkids_sf: [-5.0, 5.0]
    beta_l_nkids_f: [-5.0, 5.0]
    beta_l_educH_sm: [-5.0, 5.0]
    beta_l_educH_sf: [-8.0, 5.0]
    beta_l_educH_m: [-5.0, 5.0]
    beta_l_educH_f: [-5.0, 5.0]

    # Occupation/type/gsur opportunity
    beta_offer_isco1_2: [-25.0, 25.0]
    beta_offer_isco1_3: [-25.0, 25.0]
    beta_offer_isco1_4: [-25.0, 25.0]
    beta_offer_isco1_5: [-25.0, 25.0]
    beta_offer_isco1_6: [-25.0, 25.0]
    beta_offer_isco1_7: [-25.0, 25.0]
    beta_offer_isco1_8: [-25.0, 25.0]
    beta_offer_isco1_9: [-25.0, 25.0]
    beta_offer_type_2: [-25.0, 25.0]
    beta_offer_gsur_base: [-10.0, 10.0]
    beta_offer_gsur_type_1: [-10.0, 10.0]
    beta_offer_gsur_type_2: [-10.0, 10.0]
    beta_offer_gsur_educM: [-15.0, 15.0]

    # Focal-hours in unified market opportunity (tight bounds for stability)
    beta_offer_h_pt1_m: [-4.0, 4.0]
    beta_offer_h_pt2_m: [-4.0, 4.0]
    beta_offer_h_ft_m: [-4.0, 4.0]
    beta_offer_h_pt1_f: [-4.0, 4.0]
    beta_offer_h_pt2_f: [-4.0, 4.0]
    beta_offer_h_ft_f: [-4.0, 4.0]

  expression_constraints:
    enabled: true
    default_mode: soft
    default_weight: 1000.0
    constraints:
      - name: mul_cou_m_positive
        expression: mul
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6
      - name: mul_cou_f_positive
        expression: mul
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6

gradient_verification:
  enabled: false
  method: "central"
  epsilon: 1.0e-7
  tolerance: 1.0e-4
  check_at_init: true
  check_random_points: 0
  random_seed: 13
  verbose: true
