# ==============================================================================
# RURO MNL Estimation Specification - Job Choice M2h (Pruned for stability)
# ==============================================================================
# Design goal:
# - Keep the strong M2e_a fit gains.
# - Remove terms that repeatedly hit bounds / show degenerate SE.
# - Preserve identification robustness while improving participation fit.
#
# Changes vs M2e_a:
# - hours_opportunity: keep only beta_h_ft (drop beta_h_pt1, beta_h_pt2)
# - market_opportunity: add beta_offer_working (extensive-margin intercept)
# - market_opportunity: drop weak isco shifts beta_offer_isco1_5, beta_offer_isco1_7
# - keep: type2 intercept, gsur base/type slopes, gsur x educM
# ==============================================================================

specification:
  name: "job_choice_M2h_pruned_stable"
  description: "Job-choice M2h: pruned opportunity with FT-only hours term and working intercept"
  wage_spec: "fw"
  model_family: "job_choice"

utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"
    box_cox_bounds: [-8.0, 0.95]

  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"
    box_cox_bounds: [-8.0, 0.95]
    shifters:
      - variable: "age_norm"
        coefficient: "beta_l_age"
      - variable: "age_norm2"
        coefficient: "beta_l_age2"
      - variable: "n_children"
        coefficient: "beta_l_nkids"
        gender_specific: true
      - variable: "educH"
        coefficient: "beta_l_educH"

hours_opportunity:
  shifters:
    - variable: "working_ft"
      coefficient: "beta_h_ft"

wage_opportunity:
  specification: "log_normal"

market_opportunity:
  applies_to: "both"
  employment_indicator: "working"
  gsur_variable: "gsur"
  offer_only_vars: ["gsur", "drgn1", "reg_nuts1_1", "reg_nuts1_2", "reg_nuts1_3", "reg_nuts1_4", "reg_nuts1_5", "reg_nuts1_6", "reg_nuts1_7", "reg_nuts1_8"]
  center_within_choice_set: true
  center_weights: "proposal"
  enforce_job_varying: true
  variable_scales:
    gsur: 10.0

  shifters:
    # Extensive-margin working intercept
    - variable: "working"
      coefficient: "beta_offer_working"

    # Occupation access shifts (isco1=1 reference); pruned weak 5 and 7
    - variable: "isco1_2"
      coefficient: "beta_offer_isco1_2"
      interaction: ["working"]
    - variable: "isco1_3"
      coefficient: "beta_offer_isco1_3"
      interaction: ["working"]
    - variable: "isco1_4"
      coefficient: "beta_offer_isco1_4"
      interaction: ["working"]
    - variable: "isco1_6"
      coefficient: "beta_offer_isco1_6"
      interaction: ["working"]
    - variable: "isco1_8"
      coefficient: "beta_offer_isco1_8"
      interaction: ["working"]
    - variable: "isco1_9"
      coefficient: "beta_offer_isco1_9"
      interaction: ["working"]

    # Type-level access shift (type_id=0 reference; type_1 intercept omitted)
    - variable: "type_id_2"
      coefficient: "beta_offer_type_2"
      interaction: ["working"]

    # Market tightness and heterogeneity
    - variable: "gsur"
      coefficient: "beta_offer_gsur_base"
      interaction: ["working"]
    - variable: "gsur"
      coefficient: "beta_offer_gsur_type_1"
      interaction: ["working", "type_id_1"]
    - variable: "gsur"
      coefficient: "beta_offer_gsur_type_2"
      interaction: ["working", "type_id_2"]
    - variable: "gsur"
      coefficient: "beta_offer_gsur_educM"
      interaction: ["working", "educM"]

couples: {}

initial_values:
  # Preference block (warm start from M2e_a run_2026-02-20_10-04-46)
  beta_l0_sm: 6.667
  beta_l_age_sm: 0.107
  beta_l_age2_sm: 0.006
  beta_l_educH_sm: -2.479
  beta_c_sm: 0.651
  theta_l_sm: -2.583
  theta_c_sm: -1.525496

  beta_l0_sf: 10.233
  beta_l_age_sf: -0.022
  beta_l_age2_sf: 0.003
  beta_l_nkids_sf: -0.209
  beta_l_educH_sf: -5.856
  beta_c_sf: 0.573
  theta_l_sf: -2.058
  theta_c_sf: -1.762

  beta_l0_m: 5.009
  beta_l_age_m: -0.046
  beta_l_age2_m: 0.004
  beta_l_educH_m: -2.874
  theta_l_m: -2.142

  beta_l0_f: 8.374
  beta_l_age_f: -0.059
  beta_l_age2_f: 0.000
  beta_l_nkids_f: -0.170
  beta_l_educH_f: -4.183
  theta_l_f: -1.825

  beta_c: 0.707
  theta_c: -3.302

  # Hours opportunity (FT-only)
  beta_h_ft: -0.161

  # Market opportunity
  beta_offer_working: -1.000
  beta_offer_isco1_2: 0.700
  beta_offer_isco1_3: 0.252
  beta_offer_isco1_4: -0.145
  beta_offer_isco1_6: -1.497
  beta_offer_isco1_8: -0.556
  beta_offer_isco1_9: -0.702
  beta_offer_type_2: 0.233
  beta_offer_gsur_base: -0.407
  beta_offer_gsur_type_1: -0.557
  beta_offer_gsur_type_2: -0.523
  beta_offer_gsur_educM: 0.574

optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 6000
  tolerance: 1.0e-8
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    # Box-Cox exponents
    theta_l_sm: [-8.0, 0.95]
    theta_c_sm: [-1.525496001, -1.525495999]
    theta_l_sf: [-8.0, 0.95]
    theta_c_sf: [-8.0, 0.95]
    theta_l_m: [-8.0, 0.95]
    theta_l_f: [-8.0, 0.95]
    theta_c: [-8.0, 0.95]

    # Preference scales
    beta_c_sm: [0.05, 50.0]
    beta_c_sf: [0.05, 50.0]
    beta_c: [0.05, 50.0]
    beta_l0_sm: [0.05, 50.0]
    beta_l0_sf: [0.05, 50.0]
    beta_l0_m: [0.05, 50.0]
    beta_l0_f: [0.05, 50.0]

    # Leisure shifters
    beta_l_age_sm: [-5.0, 5.0]
    beta_l_age2_sm: [-1.0, 1.0]
    beta_l_age_sf: [-5.0, 5.0]
    beta_l_age2_sf: [-1.0, 1.0]
    beta_l_age_m: [-5.0, 5.0]
    beta_l_age2_m: [-1.0, 1.0]
    beta_l_age_f: [-5.0, 5.0]
    beta_l_age2_f: [-1.0, 1.0]
    beta_l_nkids_sf: [-5.0, 5.0]
    beta_l_nkids_f: [-5.0, 5.0]
    beta_l_educH_sm: [-5.0, 5.0]
    beta_l_educH_sf: [-8.0, 5.0]
    beta_l_educH_m: [-5.0, 5.0]
    beta_l_educH_f: [-5.0, 5.0]

    # Hours opportunity
    beta_h_ft: [-5.0, 5.0]

    # Market opportunity
    beta_offer_working: [-5.0, 5.0]
    beta_offer_isco1_2: [-25.0, 25.0]
    beta_offer_isco1_3: [-25.0, 25.0]
    beta_offer_isco1_4: [-25.0, 25.0]
    beta_offer_isco1_6: [-25.0, 25.0]
    beta_offer_isco1_8: [-25.0, 25.0]
    beta_offer_isco1_9: [-25.0, 25.0]
    beta_offer_type_2: [-25.0, 25.0]
    beta_offer_gsur_base: [-10.0, 10.0]
    beta_offer_gsur_type_1: [-10.0, 10.0]
    beta_offer_gsur_type_2: [-10.0, 10.0]
    beta_offer_gsur_educM: [-15.0, 15.0]

  expression_constraints:
    enabled: true
    default_mode: soft
    default_weight: 1000.0
    constraints:
      - name: mul_cou_m_positive
        expression: mul
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6
      - name: mul_cou_f_positive
        expression: mul
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6

gradient_verification:
  enabled: false
  method: "central"
  epsilon: 1.0e-7
  tolerance: 1.0e-4
  check_at_init: true
  check_random_points: 0
  random_seed: 13
  verbose: true
