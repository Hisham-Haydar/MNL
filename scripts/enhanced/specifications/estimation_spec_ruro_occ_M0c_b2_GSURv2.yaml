# ==============================================================================
# RURO MNL Estimation Specification - RURO occupation-opportunity M0c_b2
# ==============================================================================
# M0c_b2 extends M0c_b with one bound relaxation:
#
#   beta_l0_m lower bound relaxed from 0.05 to 1e-6.
#
# Background: In M0c_b, `beta_l0_m` settled at its lower bound of 0.05,
# recreating the same boundary-solution pathology (1 negative Hessian
# eigenvalue) that M0c_b was designed to cure. Two hypotheses:
#   (A) The 0.05 lower bound was set too aggressively — a numerical safety
#       margin that the data can now push below.
#   (B) Couples male autonomous leisure utility is structurally zero — with
#       beta_ll = 2.587, the leisure-leisure interaction absorbs all of male
#       leisure utility, leaving the additive intercept with nothing to
#       contribute.
#
# M0c_b2 distinguishes (A) from (B) by relaxing the bound to a numerically
# meaningless value (1e-6). If beta_l0_m settles strictly interior (> 1e-3),
# hypothesis (A) is correct and Gate B may pass. If it goes to the new lower
# limit (<= 1e-5), hypothesis (B) is correct.
#
# THIS IS THE FINAL IDENTIFICATION CYCLE. The model is frozen after M0c_b2
# regardless of outcome.
#
# Changes vs `estimation_spec_ruro_occ_M0c_b.yaml`:
#   1. specification.name -> "ruro_occ_M0c_b2"
#   2. specification.description -> updated (see below)
#   3. optimization.bounds.beta_l0_m: [0.05, 50.0] -> [1.0e-6, 50.0]
#   4. initial_values.beta_l0_m: 1.0 -> 0.01 (interior away from any bound)
#
# Everything else byte-identical to M0c_b.
# Expected parameter count: 47 (unchanged).
#
# Reference docs:
#   Results/RURO_occ_M0c_b_estimation_report_v1.md  (sections 7, 13, 14, 15)
#   docs/France_case/P3a/execution_logs/single_year_baseline/M0c/RURO_occ_M0c_b_implementation_report_v1.md
# ==============================================================================

specification:
  name: "ruro_occ_M0c_b2_GSURv2"
  description: "M0c_b2: relaxes M0c_b's beta_l0_m lower bound from 0.05 to 1e-6 to test whether the M0c_b boundary was numerical or structural. Final identification cycle before declaring the model frozen."
  wage_spec: "vw"
  model_family: "regular"

utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"                   # still used for singles routing
    singles_box_cox_exponent: "theta_c_singles"   # singles shared (M0a-clean)
    couples_fixed_box_cox_exponent: 0.0           # theta_c FIXED at 0.0 (log-utility)
    box_cox_bounds: [-8.0, 0.95]

  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"
    box_cox_bounds: [-8.0, 0.95]
    shifters:
      - variable: "age_norm"
        coefficient: "beta_l_age"
      - variable: "age_norm2"
        coefficient: "beta_l_age2"
      - variable: "n_children"
        coefficient: "beta_l_nkids"
        gender_specific: true   # female only

hours_opportunity:
  shifters:
    - variable: "working"
      coefficient: "beta_E"
    - variable: "working_pt1"
      coefficient: "beta_h_pt1"
    - variable: "working_pt2"
      coefficient: "beta_h_pt2"
    - variable: "working_ft"
      coefficient: "beta_h_ft"

wage_opportunity:
  specification: "log_normal"
  mean_shifters:
    - variable: "intercept"
      coefficient: "beta_w0"
    - variable: "educL"
      coefficient: "beta_w_educL"
    - variable: "educH"
      coefficient: "beta_w_educH"
    - variable: "pexp_years"
      coefficient: "beta_w_pexp"
    - variable: "pexp_years2"
      coefficient: "beta_w_pexp2"
  variance:
    parameter: "sigma"

market_opportunity:
  applies_to: "both"
  employment_indicator: "working"
  gsur_variable: "gsur"
  offer_only_vars: ["gsur"]
  center_within_choice_set: true
  center_weights: "proposal"
  variable_scales:
    gsur: 10.0

  shifters:
    - variable: "gsur"
      coefficient: "beta_E_gsur"
      interaction: ["working"]
    - variable: "educH"
      coefficient: "beta_E_educH"
      interaction: ["working"]

occupation_opportunity:
  variable: "loc4"
  reference: 1
  shifters:
    - variable: "loc4_2"
      coefficient: "beta_occ_2_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_cf"
      applies_to: "cf"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_cf"
      applies_to: "cf"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_cf"
      applies_to: "cf"
      interaction: ["working"]

couples:
  leisure_interaction:
    coefficient: "beta_ll"

initial_values:
  beta_l0_sm: 1.0
  beta_l_age_sm: 0.0
  beta_l_age2_sm: 0.0
  beta_c_sm: 1.0
  theta_l_sm: -1.0

  beta_l0_sf: 1.0
  beta_l_age_sf: 0.0
  beta_l_age2_sf: 0.0
  beta_l_nkids_sf: 0.0
  beta_c_sf: 1.0
  theta_l_sf: -1.0

  theta_c_singles: -1.0

  beta_l0_m: 0.01    # CHANGED from 1.0: interior start away from new lower bound (1e-6)
  beta_l_age_m: 0.0
  beta_l_age2_m: 0.0
  theta_l_m: -1.0

  beta_l0_f: 1.0
  beta_l_age_f: 0.0
  beta_l_age2_f: 0.0
  beta_l_nkids_f: 0.0
  theta_l_f: -1.0

  beta_c: 1.0
  # theta_c is NOT listed — fixed at 0.0 and not estimated.

  beta_E:     0.0
  beta_h_pt1: 0.0
  beta_h_pt2: 0.0
  beta_h_ft:  0.0

  beta_E_gsur:  0.0
  beta_E_educH: 0.0

  beta_w0:       2.0
  beta_w_educL: -0.1
  beta_w_educH:  0.2
  beta_w_pexp:   0.02
  beta_w_pexp2: -0.0003

  beta_occ_2_sm: 0.0
  beta_occ_3_sm: 0.0
  beta_occ_4_sm: 0.0
  beta_occ_2_sf: 0.0
  beta_occ_3_sf: 0.0
  beta_occ_4_sf: 0.0
  beta_occ_2_cm: 0.0
  beta_occ_3_cm: 0.0
  beta_occ_4_cm: 0.0
  beta_occ_2_cf: 0.0
  beta_occ_3_cf: 0.0
  beta_occ_4_cf: 0.0

  sigma: 0.5

  beta_ll: 2.0   # warm-start from M0c_b interior solution

optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 6000
  tolerance: 1.0e-8
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    theta_l_sm: [-8.0, 0.95]
    theta_l_sf: [-8.0, 0.95]
    theta_l_m:  [-8.0, 0.95]
    theta_l_f:  [-8.0, 0.95]
    theta_c_singles: [-8.0, 0.95]
    # theta_c NOT listed — fixed at 0.0, not estimated.

    beta_c_sm: [0.05, 50.0]
    beta_c_sf: [0.05, 50.0]
    beta_c:    [0.05, 50.0]
    beta_l0_sm: [0.05, 50.0]
    beta_l0_sf: [0.05, 50.0]
    beta_l0_m:  [1.0e-6, 50.0]   # CHANGED from [0.05, 50.0]: relaxed to distinguish numerical vs structural
    beta_l0_f:  [0.05, 50.0]

    beta_l_age_sm:   [-5.0, 5.0]
    beta_l_age2_sm:  [-1.0, 1.0]
    beta_l_age_sf:   [-5.0, 5.0]
    beta_l_age2_sf:  [-1.0, 1.0]
    beta_l_age_m:    [-5.0, 5.0]
    beta_l_age2_m:   [-1.0, 1.0]
    beta_l_age_f:    [-5.0, 5.0]
    beta_l_age2_f:   [-1.0, 1.0]
    beta_l_nkids_sf: [-5.0, 5.0]
    beta_l_nkids_f:  [-5.0, 5.0]

    beta_E:     [-25.0, 25.0]
    beta_h_pt1: [-10.0, 10.0]
    beta_h_pt2: [-10.0, 10.0]
    beta_h_ft:  [-10.0, 10.0]

    beta_w0:       [-10.0, 20.0]
    beta_w_educL:  [-5.0, 5.0]
    beta_w_educH:  [-5.0, 5.0]
    beta_w_pexp:   [-1.0, 1.0]
    beta_w_pexp2:  [-0.1, 0.1]

    beta_E_gsur:  [-10.0, 10.0]
    beta_E_educH: [-10.0, 10.0]

    beta_occ_2_sm: [-10.0, 10.0]
    beta_occ_3_sm: [-10.0, 10.0]
    beta_occ_4_sm: [-10.0, 10.0]
    beta_occ_2_sf: [-10.0, 10.0]
    beta_occ_3_sf: [-10.0, 10.0]
    beta_occ_4_sf: [-10.0, 10.0]
    beta_occ_2_cm: [-10.0, 10.0]
    beta_occ_3_cm: [-10.0, 10.0]
    beta_occ_4_cm: [-10.0, 10.0]
    beta_occ_2_cf: [-10.0, 10.0]
    beta_occ_3_cf: [-10.0, 10.0]
    beta_occ_4_cf: [-10.0, 10.0]

    sigma: [0.1, 20.0]

    beta_ll: [0.0, 10.0]   # unchanged from M0c_b

  expression_constraints:
    enabled: true
    default_mode: soft
    default_weight: 1000.0
    constraints:
      - name: mul_cou_m_positive
        expression: mul
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6
      - name: mul_cou_f_positive
        expression: mul
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6

gradient_verification:
  enabled: false
