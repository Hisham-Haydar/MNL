# ==============================================================================
# RURO MNL Estimation Specification - Pooled Consumption
# ==============================================================================
# POOLING STRATEGY: Initialize all consumption params to same value (beta_c=1.0)
# This effectively pools consumption across all groups during optimization.
# Leisure: Parser creates 4 intercepts (_sm, _sf, _m, _f) + 4 thetas
# Consumption: Parser creates 3 params (_sm, _sf, base) all initialized equal
# NOTE: Parser creates 14 total parameters but constraint forces pooling
# ==============================================================================

specification:
  name: "pooled_consumption"
  description: "Consumption pooled via equal initialization (3 params set equal), leisure 4-group with thetas, wage. 14 params with pooling constraint"
  wage_spec: "vw"

# Utility Function (Preference Side)
utility:
  functional_form: "box_cox"  # Box-Cox form (with theta fixed at 0 for log utility)

  consumption:
    coefficient: "beta_c"  # POOLED: Single param for ALL groups (no suffixes created)
    box_cox_exponent: null  # No Box-Cox theta for consumption (fixed at log)

  leisure:
    intercept: "beta_l0"  # Will be split by gender only
    box_cox_exponent: "theta_l"  # Box-Cox curvature (will be tightly bounded)
    shifters: []

# Hours Opportunity Density
hours_opportunity:
  shifters:
    - variable: "working"
      coefficient: "beta_work"
      description: "Working indicator (h>0)"

# Wage Opportunity Density
wage_opportunity:
  specification: "log_normal"

  mean_shifters:
    - variable: "intercept"
      coefficient: "beta_w0"
      description: "Log-wage intercept"

  variance:
    parameter: "sigma"
    description: "Standard deviation of log-wage residual"
    bounds: [0.1, 20.0]

# Singles/Couples sections - POOL leisure by gender ONLY (not by single/couple)
singles:
  gender_specific_leisure: true

couples:
  gender_specific_leisure: true
  leisure_interaction:
    coefficient: null

# Parameter Initialization
# NOTE: Parser ALWAYS creates singles (_sm, _sf) parameters, even with pooling intent
# So we initialize them with same values to enforce pooling in the optimization
initial_values:
  # Leisure intercepts - by gender (parser creates _sm, _sf, _m, _f)
  beta_l0_sm: 0.35   # Singles male (set equal to beta_l0_m for pooling)
  beta_l0_sf: 1.01   # Singles female (set equal to beta_l0_f for pooling)
  beta_l0_m: 0.35    # Couples male
  beta_l0_f: 1.01    # Couples female

  # Leisure Box-Cox thetas (by gender, 2 params)
  theta_l_sm: 0.0
  theta_l_sf: 0.0
  theta_l_m: 0.0
  theta_l_f: 0.0

  # Consumption - Pooled (parser creates _sm, _sf, base)
  # All set to same value to enforce pooling across all groups
  beta_c_sm: 1.0     # Singles male (pooled)
  beta_c_sf: 1.0     # Singles female (pooled)
  beta_c: 1.0        # Couples (pooled)

  # Hours opportunity and wage
  beta_work: 1.3950
  beta_w0: 2.1850
  sigma: 0.4723

# Optimization Settings
optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 10000
  tolerance: 1.0e-9
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  # Bounds: Keep theta parameters tightly bounded near 0 (log utility)
  bounds:
    theta_l_m: [0.0, 0.000001]
    theta_l_f: [0.0, 0.000001]
    sigma: [0.1, 20.0]
