# ==============================================================================
# RURO MNL Estimation Specification - Base (VW)
# ==============================================================================
# Variable wages with Box-Cox utility, Mincer wage equation, focal hours
#
# This specification uses:
# - Box-Cox utility function for consumption and leisure
# - Mincer wage equation (log-normal with education and experience)
# - Focal hours indicators (part-time 1/2, full-time)
# - GSUR unemployment rate effects
# ==============================================================================

specification:
  name: "base_vw"
  description: "Variable wages with Box-Cox utility, Mincer wages, focal hours"
  wage_spec: "vw"  # fw | vw | loc_empirical

# ------------------------------------------------------------------------------
# Utility Function (Preference Side)
# ------------------------------------------------------------------------------
utility:
  functional_form: "box_cox"  # box_cox | log | linear

  # Consumption utility: β_c * BC(c; θ_c)
  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"
    box_cox_bounds: [0.0, 5.0]  # Allow log utility (theta=0) and flexible curvature

  # Leisure utility: [β_l0 + Σ β_l_X * X] * BC(l; θ_l)
  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"
    box_cox_bounds: [-7.0, 1.0]  # Allow near-log utility (theta→0) and flexible curvature

    shifters:
      - variable: "age_norm"
        coefficient: "beta_l_age_norm"
        description: "Age effect (demeaned)"

      - variable: "age_norm2"
        coefficient: "beta_l_age_norm2"
        description: "Age squared (quadratic aging effect)"

      - variable: "n_children"
        coefficient: "beta_l_n_children"
        description: "Number of children effect"
        gender_specific: true  # Only for females in singles, always for females in couples

      - variable: "educL"
        coefficient: "beta_l_educL"
        description: "Low education dummy"

      - variable: "educH"
        coefficient: "beta_l_educH"
        description: "High education dummy"
        # educM is reference category (omitted)

# ------------------------------------------------------------------------------
# Hours Opportunity Density (log h(h|X))
# ------------------------------------------------------------------------------
hours_opportunity:
  shifters:
    - variable: "working"
      coefficient: "beta_work"
      description: "Working indicator (h>0)"

    - variable: "working_pt1"
      coefficient: "beta_pt1"
      description: "Part-time 1 focal point (~20h)"

    - variable: "working_pt2"
      coefficient: "beta_pt2"
      description: "Part-time 2 focal point (~30h)"

    - variable: "working_ft"
      coefficient: "beta_ft"
      description: "Full-time focal point (~40h)"

    - variable: "gsur"
      coefficient: "beta_gsur"
      description: "Group-specific unemployment rate"
      interaction: "working"  # Only affects h>0

    - variable: "educL"
      coefficient: "beta_work_educL"
      description: "Low education × working interaction"
      interaction: "working"

    - variable: "educH"
      coefficient: "beta_work_educH"
      description: "High education × working interaction"
      interaction: "working"

    # NEW: Gender interaction (female = 1)
    - variable: "female"
      coefficient: "beta_work_female"
      description: "Female × working interaction"
      interaction: "working"

    # NEW: Couple status interaction (couple = 1)
    - variable: "in_couple"
      coefficient: "beta_work_couple"
      description: "In couple × working interaction"
      interaction: "working"

    # NEW: Region interaction (drgn1 = Île-de-France indicator)
    - variable: "drgn1"
      coefficient: "beta_work_idf"
      description: "Île-de-France region × working interaction"
      interaction: "working"

# ------------------------------------------------------------------------------
# Wage Opportunity Density (log w(w|X)) - Mincer Equation
# ------------------------------------------------------------------------------
wage_opportunity:
  specification: "log_normal"  # log w ~ N(μ(X), σ²)

  mean_shifters:
    - variable: "intercept"
      coefficient: "beta_w0"
      description: "Log-wage intercept"

    - variable: "educL"
      coefficient: "beta_w_educL"
      description: "Low education wage penalty"

    - variable: "educH"
      coefficient: "beta_w_educH"
      description: "High education wage premium"

    - variable: "pexp_years"
      coefficient: "beta_pexp"
      description: "Experience (linear term)"

    - variable: "pexp_years2"
      coefficient: "beta_pexp2"
      description: "Experience squared (concave returns)"

  variance:
    parameter: "sigma"
    description: "Standard deviation of log-wage residual"
    bounds: [0.1, 20.0]

# ------------------------------------------------------------------------------
# Singles-Specific Parameters
# ------------------------------------------------------------------------------
singles:
  # CRITICAL: Singles males and females have SEPARATE leisure parameters
  # Each gender has their own preference parameters!
  gender_specific_leisure: true  # Enable gender-specific parameters for singles

  # Gender-specific leisure parameters (when gender_specific_leisure=true):
  # Singles Male (_sm suffix):
  # - beta_l0_sm, beta_l_age_norm_sm, beta_l_age_norm2_sm
  # - beta_l_educL_sm, beta_l_educH_sm
  # - beta_c_sm, theta_l_sm, theta_c_sm
  #
  # Singles Female (_sf suffix):
  # - beta_l0_sf, beta_l_age_norm_sf, beta_l_age_norm2_sf, beta_l_n_children_sf
  # - beta_l_educL_sf, beta_l_educH_sf
  # - beta_c_sf, theta_l_sf, theta_c_sf

# ------------------------------------------------------------------------------
# Couples-Specific Parameters
# ------------------------------------------------------------------------------
couples:
  # CRITICAL: Couples have GENDER-SPECIFIC leisure parameters
  # Males and females in couples have different preferences!
  gender_specific_leisure: true  # Enable gender-specific beta_l0, theta_l, etc.

  leisure_interaction:
    coefficient: "beta_interact"
    description: "Male-female leisure cross-term (complementarity)"

  # Gender-specific leisure parameters (when gender_specific_leisure=true):
  # Couples Male (_m suffix):
  # - beta_l0_m, beta_l_age_norm_m, beta_l_age_norm2_m
  # - beta_l_educL_m, beta_l_educH_m
  # - theta_l_m (Box-Cox exponent)
  #
  # Couples Female (_f suffix):
  # - beta_l0_f, beta_l_age_norm_f, beta_l_age_norm2_f, beta_l_n_children_f
  # - beta_l_educL_f, beta_l_educH_f
  # - theta_l_f (Box-Cox exponent)
  #
  # Shared parameters (household level):
  # - beta_c, theta_c (consumption - household level)

# ------------------------------------------------------------------------------
# Parameter Initialization
# ------------------------------------------------------------------------------
initial_values:
  # ============================================================================
  # GROUP 1: Singles Male (_sm suffix) - WARM START from previous estimation
  # ============================================================================
  beta_l0_sm: 0.4179
  beta_l_age_norm_sm: -0.0076
  beta_l_age_norm2_sm: -0.0017
  beta_l_educL_sm: 0.1389
  beta_l_educH_sm: -0.3457
  beta_c_sm: 1.0399
  theta_l_sm: 0.001  # Was at bound (0), start slightly above
  theta_c_sm: 0.2628

  # ============================================================================
  # GROUP 2: Singles Female (_sf suffix) - WARM START
  # ============================================================================
  beta_l0_sf: 0.6778
  beta_l_age_norm_sf: -0.0208
  beta_l_age_norm2_sf: -0.0006
  beta_l_n_children_sf: 0.2244
  beta_l_educL_sf: 0.1394
  beta_l_educH_sf: -0.4689
  beta_c_sf: 0.7602
  theta_l_sf: 0.0352
  theta_c_sf: 0.5345

  # ============================================================================
  # GROUP 3: Couples Male (_m suffix) - WARM START
  # ============================================================================
  beta_l0_m: 0.2886
  beta_l_age_norm_m: -0.0031
  beta_l_age_norm2_m: -0.0027
  beta_l_educL_m: 0.1749
  beta_l_educH_m: -0.7092
  theta_l_m: 0.0968

  # ============================================================================
  # GROUP 4: Couples Female (_f suffix) - WARM START
  # ============================================================================
  beta_l0_f: 1.3515
  beta_l_age_norm_f: -0.0334
  beta_l_age_norm2_f: -0.0006
  beta_l_n_children_f: 0.1  # Was at bound (0.1)
  beta_l_educL_f: 0.1644
  beta_l_educH_f: -0.2558
  theta_l_f: 0.001  # Was at bound (0), start slightly above

  # ============================================================================
  # COUPLES HOUSEHOLD: Consumption (shared for couples household) - WARM START
  # ============================================================================
  beta_c: 1.2740
  theta_c: 0.2926
  # ============================================================================
  # SHARED OPPORTUNITY: Hours (all groups) - WARM START
  # ============================================================================
  beta_work: 1.3950
  beta_pt1: 1.3308
  beta_pt2: 1.9189
  beta_ft: 2.9088
  beta_gsur: 0.0  # Was at bound
  beta_work_educL: -0.4419
  beta_work_educH: 0.7037
  # NEW interaction parameters (start at 0)
  beta_work_female: 0.0      # Female × working
  beta_work_couple: 0.0      # In couple × working
  beta_work_idf: 0.0         # Île-de-France × working

  # ============================================================================
  # SHARED OPPORTUNITY: Wages (all groups) - WARM START
  # ============================================================================
  beta_w0: 2.1850
  beta_w_educL: -0.0332
  beta_w_educH: 0.2865
  beta_pexp: 0.0032
  beta_pexp2: 0.0  # Was at bound (0)
  sigma: 0.4723
  # ============================================================================
  # COUPLES ONLY: Interaction - WARM START
  # ============================================================================
  beta_interact: -0.5534

# ------------------------------------------------------------------------------
# Optimization Settings
# ------------------------------------------------------------------------------
optimization:
  method: "L-BFGS-B"  # L-BFGS-B | BFGS | trust-constr
  analytical_gradient: true
  max_iterations: 10000
  # L-BFGS-B convergence tolerances
  # ftol: relative change in f(x) must be > ftol * |f(x)| to continue
  # gtol: norm of projected gradient must be > gtol to continue
  tolerance: 1.0e-9      # ftol (function value relative change) - TIGHTENED
  gradient_tolerance: 1.0e-6  # gtol (projected gradient norm) - NEW!

  # Display settings
  disp: true  # Enable optimizer output
  iprint: 1  # Print every iteration (L-BFGS-B specific)

  # Bounds for constrained parameters
  # Format: parameter_name: [lower_bound, upper_bound]
  # Unbounded parameters should be omitted
  bounds:
    # Singles Male Box-Cox parameters
    theta_l_sm: [0.0, 5.0]  # Singles male leisure curvature
    theta_c_sm: [0.0, 5.0]  # Singles male consumption curvature
    # Singles Female Box-Cox parameters
    theta_l_sf: [0.0, 5.0]  # Singles female leisure curvature
    theta_c_sf: [0.0, 5.0]  # Singles female consumption curvature
    # Couples Male Box-Cox parameter
    theta_l_m: [0.0, 5.0]  # Couples male leisure curvature
    # Couples Female Box-Cox parameter
    theta_l_f: [0.0, 5.0]  # Couples female leisure curvature
    # Couples Household Consumption Box-Cox
    theta_c: [0.0, 5.0]  # Couples household consumption curvature
    # Wage parameters (shared)
    sigma: [0.1, 20.0]
    beta_pexp2: [-10.0, 0.0]  # Must be negative (concave wage-experience profile)
    # Other beta parameters are unbounded

# ------------------------------------------------------------------------------
# Gradient Verification (Debugging/Validation)
# ------------------------------------------------------------------------------
gradient_verification:
  enabled: true  # ENABLED to verify analytical gradients
  method: "central"  # "forward" or "central" (central is more accurate)
  epsilon: 1.0e-7  # Step size for finite differences
  tolerance: 1.0e-4  # Max acceptable relative error
  check_at_init: true  # Check gradient at initial values
  check_random_points: 0  # Number of random points to test (0 = disabled)
  random_seed: 42
  verbose: true  # Print detailed comparison

# ------------------------------------------------------------------------------
# Notes
# ------------------------------------------------------------------------------
# - This specification uses the enhanced pipeline normalization constants
# - Prior correction is applied automatically using the 'prior' column
# - GSUR unemployment rates should be in the data (gsur or u_rate column)
# - Experience variables (pexp_years) should be in years, not months
# - Focal hours bands: PT1=[15,25], PT2=[25,35], FT=[35,45]
