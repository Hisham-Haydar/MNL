      interaction: ["working", "isco1_9"]

    # M2+ additions: age_norm × isco1
    - variable: "age_norm"
      coefficient: "beta_offer_age_isco1_1"
      interaction: ["working", "isco1_1"]
    - variable: "age_norm"
      coefficient: "beta_offer_age_isco1_2"
      interaction: ["working", "isco1_2"]
    - variable: "age_norm"
      coefficient: "beta_offer_age_isco1_3"
      interaction: ["working", "isco1_3"]
    - variable: "age_norm"
      coefficient: "beta_offer_age_isco1_4"
      interaction: ["working", "isco1_4"]
    - variable: "age_norm"
      coefficient: "beta_offer_age_isco1_5"
