# ==============================================================================
# RURO MNL Estimation Specification - Job Choice Identification Ladder (M2 lite)
# ==============================================================================
# Tier M2 (lite):
#   M1 + gsur_i * 1[j is working] * 1[isco1_j in subset]
# Changes:
#   - scale gsur by 10x
#   - tighter offer bounds to prevent extremes
# ==============================================================================

specification:
  name: "job_choice_M2_occupation_access_lite_scaled"
  description: "Job-choice RURO M2 lite scaled: gsur x occupation access (isco1 1-4), gsur scaled x10"
  wage_spec: "fw"
  model_family: "job_choice"

utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"
    box_cox_bounds: [-8.0, 0.95]

  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"
    box_cox_bounds: [-8.0, 0.95]
    shifters: []

hours_opportunity:
  shifters: []

wage_opportunity:
  specification: "log_normal"

market_opportunity:
  tier: "M2"
  applies_to: "both"
  employment_indicator: "working"
  gsur_variable: "gsur"
  occupation_variable: "isco1"
  occupation_categories: [0, 1, 2, 3, 4]
  occupation_base: 0
  coef_working: "beta_offer_working"
  coef_gsur: "beta_offer_gsur"
  coef_gsur_occ_prefix: "beta_offer_gsur_isco1_"
  offer_only_vars: ["gsur", "reg2", "reg3", "reg4", "reg5", "reg6", "reg7", "reg8"]
  variable_scales:
    gsur: 10.0
  center_within_choice_set: false
  center_weights: "uniform"
  enforce_job_varying: true

couples: {}

initial_values:
  # Singles male
  beta_l0_sm: 0.30
  beta_c_sm: 0.80
  theta_l_sm: -0.20
  theta_c_sm: 0.20

  # Singles female
  beta_l0_sf: 0.30
  beta_c_sf: 0.80
  theta_l_sf: -0.20
  theta_c_sf: 0.20

  # Couples male leisure
  beta_l0_m: 0.30
  theta_l_m: -0.20

  # Couples female leisure
  beta_l0_f: 0.30
  theta_l_f: -0.20

  # Couples household consumption
  beta_c: 0.80
  theta_c: 0.20

  # Opportunity
  beta_offer_working: 0.50
  beta_offer_gsur: -0.10
  beta_offer_gsur_isco1_1: 0.00
  beta_offer_gsur_isco1_2: 0.00
  beta_offer_gsur_isco1_3: 0.00
  beta_offer_gsur_isco1_4: 0.00

optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 6000
  tolerance: 1.0e-8
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    # Box-Cox exponents
    theta_l_sm: [-8.0, 0.95]
    theta_c_sm: [-8.0, 0.95]
    theta_l_sf: [-8.0, 0.95]
    theta_c_sf: [-8.0, 0.95]
    theta_l_m: [-8.0, 0.95]
    theta_l_f: [-8.0, 0.95]
    theta_c: [-8.0, 0.95]

    # Preference scales
    beta_c_sm: [0.05, 50.0]
    beta_c_sf: [0.05, 50.0]
    beta_c: [0.05, 50.0]
    beta_l0_sm: [0.05, 50.0]
    beta_l0_sf: [0.05, 50.0]
    beta_l0_m: [0.05, 50.0]
    beta_l0_f: [0.05, 50.0]

    # Opportunity (tighter after gsur scaling)
    beta_offer_working: [-10.0, 10.0]
    beta_offer_gsur: [-8.0, 8.0]
    beta_offer_gsur_isco1_1: [-8.0, 8.0]
    beta_offer_gsur_isco1_2: [-8.0, 8.0]
    beta_offer_gsur_isco1_3: [-8.0, 8.0]
    beta_offer_gsur_isco1_4: [-8.0, 8.0]

  expression_constraints:
    enabled: true
    default_mode: soft
    default_weight: 1000.0
    constraints:
      - name: mul_cou_m_positive
        expression: mul
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6
      - name: mul_cou_f_positive
        expression: mul
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6

gradient_verification:
  enabled: false
  method: "central"
  epsilon: 1.0e-7
  tolerance: 1.0e-4
  check_at_init: true
  check_random_points: 0
  random_seed: 13
  verbose: true
