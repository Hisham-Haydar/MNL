# ==============================================================================
# RURO MNL Estimation Specification - RURO occupation-opportunity P3a pooled
# ==============================================================================
# Pooled three-year P3a specification derived from M1-clean (ruro_occ_M1_clean).
#
# Two structural additions relative to M1-clean:
#
#   1. beta_E_y2015 ADDED.  Year-2015 indicator in the market-opportunity index.
#      Captures aggregate employment-opportunity differences between FR_2015 and
#      the reference year FR_2016.  variable: year_2015_indicator = (year_tag == 1).
#
#   2. beta_E_y2017 ADDED.  Year-2017 indicator in the market-opportunity index.
#      Captures aggregate employment-opportunity differences between FR_2017 and
#      the reference year FR_2016.  variable: year_2017_indicator = (year_tag == 3).
#
# Reference year: FR_2016 (year_tag == 2); beta_E_y2016 is the omitted category.
#
# Parameter count: 55 (53 M1-clean + 2 year dummies).
#
# Data input: Data/processed/fr/pooled/fr_p3a_gsurv2_harmonised.parquet
#   provisioning_label: gsurv2_opportunity_year_aligned
#   rows: 1,244,500 (FR_2015 423,500 + FR_2016 425,300 + FR_2017 395,700)
#   cluster key: cluster_id = idorighh  (9,657 unique clusters)
#
# Changes vs `estimation_spec_ruro_occ_M1_clean.yaml`:
#   1. specification.name -> "ruro_occ_P3a_pooled"
#   2. specification.description -> updated (see below)
#   3. market_opportunity.shifters:
#      - added: beta_E_y2015 entry (after beta_E_drgn8)
#      - added: beta_E_y2017 entry (after beta_E_y2015)
#   4. initial_values:
#      - added: beta_E_y2015: 0.0
#      - added: beta_E_y2017: 0.0
#   5. optimization.bounds:
#      - added: beta_E_y2015: [-5.0, 5.0]
#      - added: beta_E_y2017: [-5.0, 5.0]
#
# Everything else byte-identical to M1-clean.
# Expected parameter count: 55 (53 + 2).
#
# Reference docs:
#   docs/JMP_pooled_P3a_estimation_design_memo_v1.md
#   docs/archive/2026-05-26_round2_chain_compression/doc_only_corrections/JMP_pooled_P3a_estimation_design_memo_correction_v1.md
#   docs/JMP_stage_M1_P3a_GSURv2_construction_verdict_v1.md
#   scripts/enhanced/specifications/estimation_spec_ruro_occ_M1_clean.yaml
# ==============================================================================

specification:
  name: "ruro_occ_P3a_pooled"
  description: "P3a pooled: three-year pooled MNL specification derived from M1-clean. Adds two year-dummy shifters in the market-opportunity index (beta_E_y2015, beta_E_y2017) with FR_2016 as the omitted reference year. Covers survey years FR_2015 (year_tag=1), FR_2016 (year_tag=2), FR_2017 (year_tag=3) from the GSURv2 opportunity-year-aligned pooled parquet. All structural preference and opportunity blocks are carried forward unchanged from M1-clean. 55 free parameters = 53 M1-clean + 2 year dummies."
  wage_spec: "vw"
  model_family: "regular"

utility:
  functional_form: "box_cox"

  consumption:
    coefficient: "beta_c"
    box_cox_exponent: "theta_c"                   # still used for singles routing
    singles_box_cox_exponent: "theta_c_singles"   # singles shared (M0a-clean)
    couples_fixed_box_cox_exponent: 0.0           # theta_c FIXED at 0.0 (log-utility)
    box_cox_bounds: [-8.0, 0.95]

  leisure:
    intercept: "beta_l0"
    box_cox_exponent: "theta_l"
    box_cox_bounds: [-8.0, 0.95]
    shifters:
      - variable: "age_norm"
        coefficient: "beta_l_age"
      - variable: "age_norm2"
        coefficient: "beta_l_age2"
      - variable: "n_children"
        coefficient: "beta_l_nkids"
        gender_specific: true   # female only

hours_opportunity:
  shifters:
    - variable: "working"
      coefficient: "beta_E"
    - variable: "working_pt1"
      coefficient: "beta_h_pt1"
    - variable: "working_pt2"
      coefficient: "beta_h_pt2"
    - variable: "working_ft"
      coefficient: "beta_h_ft"

wage_opportunity:
  specification: "log_normal"
  mean_shifters:
    - variable: "intercept"
      coefficient: "beta_w0"
    - variable: "educL"
      coefficient: "beta_w_educL"
    - variable: "educH"
      coefficient: "beta_w_educH"
    - variable: "pexp_years"
      coefficient: "beta_w_pexp"
    - variable: "pexp_years2"
      coefficient: "beta_w_pexp2"
  variance:
    parameter: "sigma"

market_opportunity:
  applies_to: "both"
  employment_indicator: "working"
  gsur_variable: "gsur"
  offer_only_vars: ["gsur"]
  center_within_choice_set: true
  center_weights: "proposal"
  variable_scales:
    gsur: 10.0

  shifters:
    - variable: "gsur"
      coefficient: "beta_E_gsur"
      interaction: ["working"]
    - variable: "reg2"
      coefficient: "beta_E_drgn2"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg3"
      coefficient: "beta_E_drgn3"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg4"
      coefficient: "beta_E_drgn4"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg5"
      coefficient: "beta_E_drgn5"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg6"
      coefficient: "beta_E_drgn6"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg7"
      coefficient: "beta_E_drgn7"
      interaction: ["working"]
      applies_to: "household"
    - variable: "reg8"
      coefficient: "beta_E_drgn8"
      interaction: ["working"]
      applies_to: "household"
    - variable: "year_2015_indicator"
      coefficient: "beta_E_y2015"
      interaction: ["working"]
      applies_to: "household"
    - variable: "year_2017_indicator"
      coefficient: "beta_E_y2017"
      interaction: ["working"]
      applies_to: "household"

occupation_opportunity:
  variable: "loc4"
  reference: 1
  shifters:
    - variable: "loc4_2"
      coefficient: "beta_occ_2_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_sm"
      applies_to: "sm"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_sf"
      applies_to: "sf"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_cm"
      applies_to: "cm"
      interaction: ["working"]
    - variable: "loc4_2"
      coefficient: "beta_occ_2_cf"
      applies_to: "cf"
      interaction: ["working"]
    - variable: "loc4_3"
      coefficient: "beta_occ_3_cf"
      applies_to: "cf"
      interaction: ["working"]
    - variable: "loc4_4"
      coefficient: "beta_occ_4_cf"
      applies_to: "cf"
      interaction: ["working"]

couples:
  leisure_interaction:
    coefficient: "beta_ll"

initial_values:
  beta_l0_sm: 1.0
  beta_l_age_sm: 0.0
  beta_l_age2_sm: 0.0
  beta_c_sm: 1.0
  theta_l_sm: -1.0

  beta_l0_sf: 1.0
  beta_l_age_sf: 0.0
  beta_l_age2_sf: 0.0
  beta_l_nkids_sf: 0.0
  beta_c_sf: 1.0
  theta_l_sf: -1.0

  theta_c_singles: -1.0

  beta_l0_m: 0.01
  beta_l_age_m: 0.0
  beta_l_age2_m: 0.0
  theta_l_m: -1.0

  beta_l0_f: 1.0
  beta_l_age_f: 0.0
  beta_l_age2_f: 0.0
  beta_l_nkids_f: 0.0
  theta_l_f: -1.0

  beta_c: 1.0
  # theta_c is NOT listed — fixed at 0.0 and not estimated.

  beta_E:     0.0
  beta_h_pt1: 0.0
  beta_h_pt2: 0.0
  beta_h_ft:  0.0

  beta_E_gsur:   0.0
  beta_E_drgn2:  0.0
  beta_E_drgn3:  0.0
  beta_E_drgn4:  0.0
  beta_E_drgn5:  0.0
  beta_E_drgn6:  0.0
  beta_E_drgn7:  0.0
  beta_E_drgn8:  0.0
  beta_E_y2015:  0.0
  beta_E_y2017:  0.0

  beta_w0:       2.0
  beta_w_educL: -0.1
  beta_w_educH:  0.2
  beta_w_pexp:   0.02
  beta_w_pexp2: -0.0003

  beta_occ_2_sm: 0.0
  beta_occ_3_sm: 0.0
  beta_occ_4_sm: 0.0
  beta_occ_2_sf: 0.0
  beta_occ_3_sf: 0.0
  beta_occ_4_sf: 0.0
  beta_occ_2_cm: 0.0
  beta_occ_3_cm: 0.0
  beta_occ_4_cm: 0.0
  beta_occ_2_cf: 0.0
  beta_occ_3_cf: 0.0
  beta_occ_4_cf: 0.0

  sigma: 0.5

  beta_ll: 2.0

optimization:
  method: "L-BFGS-B"
  analytical_gradient: true
  max_iterations: 6000
  tolerance: 1.0e-8
  gradient_tolerance: 1.0e-6
  disp: true
  iprint: 1

  bounds:
    theta_l_sm: [-8.0, 0.95]
    theta_l_sf: [-8.0, 0.95]
    theta_l_m:  [-8.0, 0.95]
    theta_l_f:  [-8.0, 0.95]
    theta_c_singles: [-8.0, 0.95]
    # theta_c NOT listed — fixed at 0.0, not estimated.

    beta_c_sm: [0.05, 50.0]
    beta_c_sf: [0.05, 50.0]
    beta_c:    [0.05, 50.0]
    beta_l0_sm: [0.05, 50.0]
    beta_l0_sf: [0.05, 50.0]
    beta_l0_m:  [1.0e-6, 50.0]
    beta_l0_f:  [0.05, 50.0]

    beta_l_age_sm:   [-5.0, 5.0]
    beta_l_age2_sm:  [-1.0, 1.0]
    beta_l_age_sf:   [-5.0, 5.0]
    beta_l_age2_sf:  [-1.0, 1.0]
    beta_l_age_m:    [-5.0, 5.0]
    beta_l_age2_m:   [-1.0, 1.0]
    beta_l_age_f:    [-5.0, 5.0]
    beta_l_age2_f:   [-1.0, 1.0]
    beta_l_nkids_sf: [-5.0, 5.0]
    beta_l_nkids_f:  [-5.0, 5.0]

    beta_E:     [-25.0, 25.0]
    beta_h_pt1: [-10.0, 10.0]
    beta_h_pt2: [-10.0, 10.0]
    beta_h_ft:  [-10.0, 10.0]

    beta_w0:       [-10.0, 20.0]
    beta_w_educL:  [-5.0, 5.0]
    beta_w_educH:  [-5.0, 5.0]
    beta_w_pexp:   [-1.0, 1.0]
    beta_w_pexp2:  [-0.1, 0.1]

    beta_E_gsur:   [-10.0, 10.0]
    beta_E_drgn2:  [-10.0, 10.0]
    beta_E_drgn3:  [-10.0, 10.0]
    beta_E_drgn4:  [-10.0, 10.0]
    beta_E_drgn5:  [-10.0, 10.0]
    beta_E_drgn6:  [-10.0, 10.0]
    beta_E_drgn7:  [-10.0, 10.0]
    beta_E_drgn8:  [-10.0, 10.0]
    beta_E_y2015:  [-5.0, 5.0]
    beta_E_y2017:  [-5.0, 5.0]

    beta_occ_2_sm: [-10.0, 10.0]
    beta_occ_3_sm: [-10.0, 10.0]
    beta_occ_4_sm: [-10.0, 10.0]
    beta_occ_2_sf: [-10.0, 10.0]
    beta_occ_3_sf: [-10.0, 10.0]
    beta_occ_4_sf: [-10.0, 10.0]
    beta_occ_2_cm: [-10.0, 10.0]
    beta_occ_3_cm: [-10.0, 10.0]
    beta_occ_4_cm: [-10.0, 10.0]
    beta_occ_2_cf: [-10.0, 10.0]
    beta_occ_3_cf: [-10.0, 10.0]
    beta_occ_4_cf: [-10.0, 10.0]

    sigma: [0.1, 20.0]

    beta_ll: [0.0, 10.0]

  expression_constraints:
    enabled: true
    default_mode: soft
    default_weight: 1000.0
    constraints:
      - name: mul_cou_m_positive
        expression: mul
        group: couples_male
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6
      - name: mul_cou_f_positive
        expression: mul
        group: couples_female
        at: {consumption: 1.0, leisure_male: 1.0, leisure_female: 1.0}
        lower: 1.0e-6

gradient_verification:
  enabled: false